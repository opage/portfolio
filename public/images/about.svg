<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-label="Profile badge illustration">
  <defs>
    <linearGradient id="aboutClay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c05a30"/>
      <stop offset="1" stop-color="#7e2f16"/>
    </linearGradient>
    <pattern id="aboutDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#8a8273"/>
    </pattern>
  </defs>

  <!-- halo + orbit -->
  <circle cx="220" cy="180" r="160" fill="#a8492a" opacity="0.08"/>
  <circle cx="220" cy="180" r="128" fill="none" stroke="#a8492a" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.35"/>

  <!-- dotted grids -->
  <rect x="18" y="30" width="94" height="76" fill="url(#aboutDots)" opacity="0.5"/>
  <rect x="330" y="256" width="94" height="76" fill="url(#aboutDots)" opacity="0.5"/>

  <!-- ground shadow -->
  <ellipse cx="220" cy="322" rx="140" ry="11" fill="#000000" opacity="0.12"/>

  <!-- ID card -->
  <rect x="70" y="52" width="300" height="252" rx="18" fill="#fffdf9" stroke="#a8492a" stroke-width="2"/>
  <rect x="70" y="52" width="300" height="52" rx="18" fill="#a8492a" opacity="0.1"/>
  <rect x="94" y="70" width="86" height="16" rx="8" fill="#a8492a" opacity="0.85"/>
  <text x="104" y="82" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" letter-spacing="2" fill="#fffdf9">PROFILE</text>

  <!-- avatar -->
  <circle cx="132" cy="152" r="34" fill="url(#aboutClay)"/>
  <circle cx="132" cy="152" r="34" fill="none" stroke="#fffdf9" stroke-width="2" opacity="0.35"/>
  <text x="132" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#fff7ef">OP</text>
  <circle cx="158" cy="176" r="12" fill="#54c48c" stroke="#fffdf9" stroke-width="2.5"/>
  <path d="M153 176 l4 4 l7 -8" fill="none" stroke="#fffdf9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- name + role -->
  <rect x="182" y="134" width="128" height="14" rx="7" fill="#221f1b"/>
  <rect x="182" y="156" width="88" height="10" rx="5" fill="#a8492a"/>
  <rect x="182" y="172" width="150" height="8" rx="4" fill="#221f1b" opacity="0.18"/>

  <!-- divider -->
  <line x1="94" y1="204" x2="346" y2="204" stroke="#221f1b" stroke-width="1" opacity="0.12"/>

  <!-- skill bars -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#221f1b">
    <circle cx="100" cy="226" r="4" fill="#a8492a"/>
    <text x="112" y="230">BACKEND</text>
    <circle cx="100" cy="252" r="4" fill="#54c48c"/>
    <text x="112" y="256">FRONTEND</text>
    <circle cx="100" cy="278" r="4" fill="#e0a23c"/>
    <text x="112" y="282">CLOUD</text>
  </g>
  <rect x="196" y="220" width="150" height="11" rx="5.5" fill="#221f1b" opacity="0.08"/>
  <rect x="196" y="220" width="132" height="11" rx="5.5" fill="url(#aboutClay)"/>
  <rect x="196" y="246" width="150" height="11" rx="5.5" fill="#221f1b" opacity="0.08"/>
  <rect x="196" y="246" width="108" height="11" rx="5.5" fill="#54c48c"/>
  <rect x="196" y="272" width="150" height="11" rx="5.5" fill="#221f1b" opacity="0.08"/>
  <rect x="196" y="272" width="120" height="11" rx="5.5" fill="#e0a23c"/>

  <!-- experience seal -->
  <g transform="rotate(8 352 108)">
    <circle cx="352" cy="108" r="30" fill="#fffdf9" stroke="#a8492a" stroke-width="2"/>
    <circle cx="352" cy="108" r="23" fill="none" stroke="#a8492a" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="352" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#a8492a">10+</text>
    <text x="352" y="119" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" letter-spacing="1" fill="#221f1b">YEARS</text>
  </g>

  <!-- plus marks + confetti -->
  <g stroke="#a8492a" stroke-width="3" stroke-linecap="round">
    <line x1="404" y1="180" x2="404" y2="196"/>
    <line x1="396" y1="188" x2="412" y2="188"/>
    <line x1="36" y1="220" x2="36" y2="236"/>
    <line x1="28" y1="228" x2="44" y2="228"/>
  </g>
  <rect x="392" y="70" width="11" height="11" rx="2" fill="#54c48c" opacity="0.6" transform="rotate(-15 397 75)"/>
  <circle cx="40" cy="310" r="5" fill="#e0a23c" opacity="0.7"/>
</svg>
