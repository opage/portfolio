<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Developer workspace illustration">
  <defs>
    <linearGradient id="clayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c05a30"/>
      <stop offset="1" stop-color="#7e2f16"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#8a8273"/>
    </pattern>
  </defs>

  <!-- halo + orbit ring -->
  <circle cx="290" cy="235" r="205" fill="#a8492a" opacity="0.08"/>
  <circle cx="290" cy="235" r="168" fill="none" stroke="#a8492a" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.35"/>

  <!-- dotted grids -->
  <rect x="30" y="52" width="112" height="92" fill="url(#dots)" opacity="0.5"/>
  <rect x="412" y="328" width="112" height="92" fill="url(#dots)" opacity="0.5"/>

  <!-- git-branch motif -->
  <g fill="none" stroke="#a8492a" stroke-width="3" opacity="0.85" stroke-linecap="round">
    <line x1="64" y1="196" x2="64" y2="384"/>
    <line x1="104" y1="252" x2="104" y2="360"/>
    <path d="M64 330 C 64 352, 104 344, 104 360" opacity="0.7"/>
  </g>
  <g stroke="#fffdf9" stroke-width="2.5">
    <circle cx="64" cy="196" r="7" fill="#a8492a"/>
    <circle cx="64" cy="292" r="7" fill="#54c48c"/>
    <circle cx="64" cy="384" r="7" fill="#a8492a"/>
    <circle cx="104" cy="252" r="7" fill="#a8492a"/>
    <circle cx="104" cy="360" r="7" fill="#e0a23c"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="310" cy="358" rx="152" ry="13" fill="#000000" opacity="0.12"/>

  <!-- code window -->
  <rect x="150" y="108" width="322" height="234" rx="16" fill="#1e1a2e" stroke="#a8492a" stroke-width="2"/>
  <line x1="150" y1="150" x2="472" y2="150" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <circle cx="173" cy="129" r="6" fill="#e2966a"/>
  <circle cx="191" cy="129" r="6" fill="#e0a23c"/>
  <circle cx="209" cy="129" r="6" fill="#54c48c"/>
  <rect x="230" y="122" width="62" height="14" rx="7" fill="#ffffff" opacity="0.08"/>
  <rect x="236" y="127" width="34" height="5" rx="2.5" fill="#ffffff" opacity="0.2"/>

  <!-- code lines -->
  <g>
    <rect x="172" y="168" width="150" height="10" rx="5" fill="#ece9e2" opacity="0.9"/>
    <rect x="192" y="194" width="212" height="10" rx="5" fill="#e2966a" opacity="0.9"/>
    <rect x="192" y="220" width="118" height="10" rx="5" fill="#54c48c" opacity="0.85"/>
    <rect x="318" y="220" width="58" height="10" rx="5" fill="#e0a23c" opacity="0.85"/>
    <rect x="212" y="246" width="162" height="10" rx="5" fill="#837b6d" opacity="0.9"/>
    <rect x="172" y="272" width="192" height="10" rx="5" fill="#ece9e2" opacity="0.9"/>
    <rect x="192" y="298" width="92" height="10" rx="5" fill="#e2966a" opacity="0.9"/>
    <rect x="292" y="292" width="12" height="22" rx="2" fill="#e2966a"/>
  </g>

  <!-- floating pills -->
  <g transform="rotate(-6 470 96)">
    <rect x="408" y="79" width="126" height="34" rx="17" fill="#fffdf9" stroke="#a8492a" stroke-width="1.5"/>
    <circle cx="426" cy="96" r="5" fill="#a8492a"/>
    <text x="438" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#221f1b">Angular</text>
  </g>
  <g transform="rotate(-4 259 70)">
    <rect x="216" y="54" width="86" height="32" rx="16" fill="#fffdf9" stroke="#a8492a" stroke-width="1.5"/>
    <circle cx="232" cy="70" r="5" fill="#a8492a"/>
    <text x="244" y="75" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#221f1b">C#</text>
  </g>
  <g transform="rotate(5 98 421)">
    <rect x="48" y="404" width="100" height="34" rx="17" fill="#fffdf9" stroke="#a8492a" stroke-width="1.5"/>
    <circle cx="64" cy="421" r="5" fill="#54c48c"/>
    <text x="76" y="426" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#221f1b">Java</text>
  </g>
  <g transform="rotate(3 245 421)">
    <rect x="170" y="404" width="150" height="34" rx="17" fill="#fffdf9" stroke="#a8492a" stroke-width="1.5"/>
    <circle cx="186" cy="421" r="5" fill="#e0a23c"/>
    <text x="198" y="426" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#221f1b">TypeScript</text>
  </g>
  <g transform="rotate(4 508 263)">
    <rect x="458" y="246" width="100" height="34" rx="17" fill="#fffdf9" stroke="#a8492a" stroke-width="1.5"/>
    <circle cx="474" cy="263" r="5" fill="#0078d4"/>
    <text x="486" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#221f1b">Azure</text>
  </g>
  <g transform="rotate(-3 382 421)">
    <rect x="336" y="404" width="92" height="34" rx="17" fill="#fffdf9" stroke="#a8492a" stroke-width="1.5"/>
    <circle cx="352" cy="421" r="5" fill="#a8492a"/>
    <text x="364" y="426" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#221f1b">CI/CD</text>
  </g>

  <!-- deploy badge -->
  <circle cx="506" cy="396" r="26" fill="url(#clayGrad)"/>
  <circle cx="506" cy="396" r="26" fill="none" stroke="#fffdf9" stroke-width="2" opacity="0.35"/>
  <path d="M495 396 l8 8 l15 -17" fill="none" stroke="#fffdf9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- plus marks + confetti -->
  <g stroke="#a8492a" stroke-width="3" stroke-linecap="round">
    <line x1="522" y1="202" x2="522" y2="218"/>
    <line x1="514" y1="210" x2="530" y2="210"/>
    <line x1="140" y1="52" x2="140" y2="68"/>
    <line x1="132" y1="60" x2="148" y2="60"/>
  </g>
  <rect x="182" y="66" width="12" height="12" rx="2" fill="#a8492a" opacity="0.5" transform="rotate(20 188 72)"/>
  <rect x="140" y="360" width="10" height="10" rx="2" fill="#54c48c" opacity="0.6" transform="rotate(-15 145 365)"/>
  <circle cx="452" cy="52" r="5" fill="#e0a23c" opacity="0.7"/>
</svg>
