intro:
  heading:
    en: LET ME **INTRODUCE** MYSELF
    fr: LAISSEZ-MOI **ME PRÉSENTER**
    lb: LOOSST MECH **VIRSCHTELLEN**
  body:
    en:
      - I'm a software craftsman who follows **SOLID principles** and loves turning ideas into reliable, scalable products.
      - I launch side projects to learn new languages and **clean architectures**.
      - I'm constantly building my skills while staying current on tech trends.
      - As a team player, I share knowledge and learn from others.
    fr:
      - Artisan logiciel appliquant les **principes SOLID** et aimant transformer des idées en produits fiables et évolutifs.
      - Je développe mes compétences en restant à jour sur les tendances technologiques.
      - Ayant l'esprit d'équipe, je partage mes connaissances et apprends des autres.
    lb:
      - Ech sinn e Software-Handwierker, deen d'**SOLID-Prinzipien** verfollegt an Iddien a verlässlech, skaléierbar Produiten ëmsetzt.
      - Ech starten Nieweprojeten, fir nei Sproochen a **propper Architekturen** ze léieren.
      - Ech bauen meng Fäegkeete weider aus a bleiwen um neisten Stand vun den Tech-Trends.
      - Als Teamplayer deelen ech Wëssen a léieren och vun aneren.
