    lb: "Liest Daten. Et ass einfach `SELECT`.\r"
  dml-data-manipulation-language:
    en: "### DML — Data Manipulation Language\r"
    fr: "### DML — Langage de manipulation des données\r"
    lb: "### DML — Data Manipulation Language\r"
  para-changes-the-data-insert:
    en: "Changes the data: `INSERT`, `UPDATE`, `DELETE`.\r"
    fr: "Modifie les données : `INSERT`, `UPDATE`, `DELETE`.\r"
    lb: "Ännert d'Donnéeën: `INSERT`, `UPDATE`, `DELETE`.\r"
  para-update-and-delete-must:
    en: "`UPDATE` and `DELETE` must carry a `WHERE` clause — without one they affect\r

      every row.\r"
    fr: "`UPDATE` et `DELETE` doivent porter une clause `WHERE` — sans elle, ils\r

      touchent chaque ligne.\r"
    lb: "`UPDATE` an `DELETE` mussen eng `WHERE`-Klausel droen — ouni si betreffen se\r

      all Zeil.\r"
  dcl-data-control-language:
    en: "### DCL — Data Control Language\r"
    fr: "### DCL — Langage de contrôle des données\r"
    lb: "### DCL — Data Control Language\r"
  para-manages-permissions-with-grant:
    en: "Manages permissions with `GRANT` and `REVOKE`.\r"
    fr: "Gère les permissions avec `GRANT` et `REVOKE`.\r"
    lb: "Geréiert Permissiounen mat `GRANT` a `REVOKE`.\r"
  tcl-transaction-control-language:
    en: "### TCL — Transaction Control Language\r"
    fr: "### TCL — Langage de contrôle des transactions\r"
    lb: "### TCL — Transaction Control Language\r"
  para-controls-transactions-with-commit:
    en: "Controls transactions with `COMMIT`, `ROLLBACK`, and `SAVEPOINT`.\r"
    fr: "Contrôle les transactions avec `COMMIT`, `ROLLBACK` et `SAVEPOINT`.\r"
    lb: "Kontrolléiert Transaktioune mat `COMMIT`, `ROLLBACK` a `SAVEPOINT`.\r"
  joins:
    en: "## Joins\r"
    fr: "## Jointures\r"
    lb: "## Joins (Jointuren)\r"
  para-joins-combine-rows-from:
    en: "Joins combine rows from two or more tables using a join condition.\r"
    fr: "Les jointures combinent des lignes de deux tables ou plus via une condition de\r

      jointure.\r"
    lb: "Joins kombinéieren Zeilen aus zwou oder méi Tabellen iwwer eng Join-Bedingung.\r"
  para-joins-pair-naturally-with:
    en: "Joins pair naturally with aggregation:\r"
    fr: "Les jointures se combinent naturellement avec l'agrégation :\r"
    lb: "Joins passen natierlech mat Aggregatioun zesummen:\r"
  para-use-table-aliases-c:
    en: "Use table aliases (`c`, `o`) for readability, and keep the join condition in\r

      `ON` rather than `WHERE` so the intent stays clear.\r"
    fr: "Utilisez des alias de table (`c`, `o`) pour la lisibilité, et gardez la\r

      condition de jointure dans `ON` plutôt que `WHERE` pour que l'intention reste\r

      claire.\r"
    lb: "Benotzt Table-Aliase (`c`, `o`) fir d'Liesbarkeet, an haalt d'Join-Bedingung am\r

      `ON` amplaz am `WHERE`, fir datt d'Intent kloer bleift.\r"
  indexes:
    en: "## Indexes\r"
    fr: "## Index\r"
    lb: "## Indexen\r"
  para-an-index-speeds-up:
    en: "An index speeds up lookups at the cost of write performance and storage. Most\r

      databases use a B-tree, which keeps data sorted for fast range and equality\r

      scans.\r"
    fr: "Un index accélère les recherches au prix de performances d'écriture et de\r

      stockage. La plupart des bases utilisent un B-tree, qui garde les données triées\r

      pour des recherches rapides par égalité et par plage.\r"
    lb: "En Index beschleunegt Lookups op Käschte vu Schreifperformance a Späicher. Déi\r

      meescht Datebanke benotzen e B-tree, deen d'Daten sortéiert hält fir séier\r

      Equality- a Range-Scans.\r"
  list-unique-index-enforces-uniqueness-like-a-unique-constraint:
    en: "- **Unique index** — enforces uniqueness like a unique constraint.\r

      - **Composite index** — covers multiple columns, left-to-right.\r

      - **Covering index** — stores extra columns so the query never touches the table.\r

      - **Partial index** — only indexes rows matching a condition.\r"
    fr: "- **Index unique** — impose l'unicité comme une contrainte unique.\r

      - **Index composite** — couvre plusieurs colonnes, de gauche à droite.\r

      - **Index couvrant** — stocke des colonnes supplémentaires pour ne jamais toucher la table.\r

      - **Index partiel** — n'indexe que les lignes qui satisfont une condition.\r"
    lb: "- **Unique Index** — setzt Eendeitegkeet duerch wéi en Unique Constraint.\r

      - **Kompositindex** — deckt méi Spalten, vu lénks no riets.\r

      - **Covering Index** — späichert zousätzlech Spalten, fir d'Tabelle ni ze beréieren.\r

      - **Partiellen Index** — indexéiert nëmmen d'Zeilen, déi eng Bedingung erfëllen.\r"
  para-a-rule-of-thumb:
    en: "A rule of thumb: index the columns you filter (`WHERE`), join (`JOIN`), and sort\r

      (`ORDER BY`) on.\r"
    fr: "Une règle simple : indexez les colonnes que vous filtrez (`WHERE`), joignez\r

      (`JOIN`) et triez (`ORDER BY`).\r"
    lb: "Eng einfach Reegel: indexéiert d'Spalten, déi Dir filtert (`WHERE`), joint\r

      (`JOIN`) a sortéiert (`ORDER BY`).\r"
  triggers:
    en: "## Triggers\r"
    fr: "## Déclencheurs (triggers)\r"
    lb: "## Triggers\r"
  para-a-trigger-runs-automatically:
    en: "A trigger runs automatically before or after `INSERT`, `UPDATE`, or `DELETE`.\r

      They are great for audit trails and derived columns. In PostgreSQL the logic\r

      lives in a trigger *function*.\r"
    fr: "Un trigger s'exécute automatiquement avant ou après `INSERT`, `UPDATE` ou\r

      `DELETE`. Ils sont parfaits pour les journaux d'audit et les colonnes dérivées.\r

      En PostgreSQL, la logique vit dans une *fonction* de trigger.\r"
    lb: "En Trigger leeft automatesch virun oder no `INSERT`, `UPDATE` oder `DELETE`. Si\r

      sinn ideal fir Audit-Loggen an ofgeleet Spalten. A PostgreSQL lieft d'Logik an\r

      enger Trigger-*Funktioun*.\r"
  functions:
    en: "## Functions\r"
    fr: "## Fonctions\r"
    lb: "## Funktiounen\r"
  para-functions-are-reusable-composable:
    en: "Functions are reusable, composable pieces of logic that return a value.\r"
    fr: "Les fonctions sont des morceaux de logique réutilisables et composables qui\r

      renvoient une valeur.\r"
    lb: "Funktiounen si widderverwendbar, komponéierbar Stécker Logik, déi e Wäert\r

      zeréckginn.\r"
  para-a-scalar-function:
    en: "A scalar function:\r"
    fr: "Une fonction scalaire :\r"
    lb: "Eng Skalarfunktioun:\r"
  para-a-table-valued-function-returns:
    en: "A table-valued function (returns a set of rows):\r"
    fr: "Une fonction table (renvoie un ensemble de lignes) :\r"
    lb: "Eng Table-Funktioun (gëtt e Set vun Zeilen zeréck):\r"
  stored-procedures:
    en: "## Stored procedures\r"
    fr: "## Procédures stockées\r"
    lb: "## Stored Procedures\r"
  para-procedures-are-like-functions:
    en: "Procedures are like functions but can manage their own transactions and do not\r

      have to return a value. Use them for multi-step, transactional operations.\r"
    fr: "Les procédures ressemblent aux fonctions mais peuvent gérer leurs propres\r

      transactions et n'ont pas à renvoyer de valeur. Utilisez-les pour des opérations\r

      transactionnelles en plusieurs étapes.\r"
    lb: "Proceduren sinn ewéi Funktiounen, kënnen awer hir eege Transaktioune geréieren a\r

      mussen kee Wäert zeréckginn. Benotzt se fir méi-Schrëtt-, transaktional\r

      Operatiounen.\r"
  isolation-levels:
    en: "## Isolation levels\r"
    fr: "## Niveaux d'isolation\r"
    lb: "## Isolatiounsniveauen\r"
  para-isolation-controls-how-much:
    en: "Isolation controls how much concurrent transactions see of each other.\r"
    fr: "L'isolation contrôle ce que les transactions concurrentes voient les unes des\r

      autres.\r"
    lb: "Isolatioun kontrolléiert, wéi vill parallel Transaktioune vunenee gesinn.\r"
  list-read-uncommitted-can-read-uncommitted-data-dirty-reads:
    en: "- **Read uncommitted** — can read uncommitted data (dirty reads).\r

      - **Read committed** — each statement sees a stable snapshot.\r

      - **Repeatable read** — the whole transaction sees one snapshot.\r

      - **Serializable** — transactions behave as if run one at a time.\r"
    fr: "- **Read uncommitted** — peut lire des données non validées (lectures sales).\r

      - **Read committed** — chaque instruction voit un instantané stable.\r

      - **Repeatable read** — toute la transaction voit un seul instantané.\r

      - **Serializable** — les transactions se comportent comme si elles s'exécutaient une à une.\r"
    lb: "- **Read uncommitted** — kann net-committéiert Daten liesen (dirty reads).\r

      - **Read committed** — all Ausso gesäit e stabilen Snapshot.\r

      - **Repeatable read** — déi ganz Transaktioun gesäit ee Snapshot.\r

      - **Serializable** — Transaktioune behuele sech, wéi wa se eng no där anerer lafen.\r"
  key-practices:
    en: "## Key practices\r"
    fr: "## Bonnes pratiques\r"
    lb: "## Wichteg Praktiken\r"
  list-use-stored-procedures-for-crud-centralize-the-data-logic-in-one-place:
    en: "- **Use stored procedures for CRUD** — centralize the data logic in one place\r

      \  and grant access to the procedure instead of the table.\r

      - **Use parameterized queries** — never concatenate user input into SQL; bind\r

      \  values as parameters to prevent SQL injection.\r

      - **Manage permissions** — let users execute CRUD procedures without direct\r

      \  table access.\r"
    fr: "- **Utilisez des procédures stockées pour le CRUD** — centralisez la logique de\r

      \  données en un seul endroit et accordez l'accès à la procédure plutôt qu'à la\r

      \  table.\r

      - **Utilisez des requêtes paramétrées** — ne concaténez jamais l'entrée\r

      \  utilisateur dans le SQL ; liez les valeurs en paramètres pour prévenir\r

      \  l'injection SQL.\r

      - **Gérez les permissions** — laissez les utilisateurs exécuter les procédures\r

      \  CRUD sans accès direct aux tables.\r"
    lb: "- **Benotzt Stored Procedures fir de CRUD** — zentraliséiert d'Datelogik op enger\r

      \  Plaz a gëtt Zougang op d'Prozedur amplaz op d'Tabelle.\r

      - **Benotzt parametriséiert Querien** — concatenéiert ni Benotzerinput an SQL;\r

      \  bindt Wäerter als Parameter, fir SQL-Injektioun ze verhënneren.\r

      - **Gitt Permissiounen** — loosst Benotzer CRUD-Prozeduren ausféieren, ouni\r

      \  direkten Tabellenzougang.\r"
  para-parameterized-statements-separate-the:
    en: "Parameterized statements separate the SQL from the values, so input is treated\r

      as data. Combined with procedure-level grants, the surface stays small and\r

      auditable.\r"
    fr: "Les instructions paramétrées séparent le SQL des valeurs, de sorte que l'entrée\r

      est traitée comme des données. Combinées aux permissions au niveau des\r

      procédures, la surface reste petite et auditable.\r"
    lb: "Parametriséiert Aussoen trennen de SQL vun de Wäerter, sou datt Input als Daten\r

      behandelt gëtt. Kombinéiert mat Prozedurniveau-Permissioune bleift d'Uewerfläch\r

      kleng an auditéierbar.\r"
  wrapping-up:
    en: "## Wrapping up\r"
    fr: "## Pour conclure\r"
    lb: "## Zum Schluss\r"
  para-acid-gives-you-correctness:
    en: "ACID gives you correctness; keys give you integrity; indexes give you speed;\r

      triggers, functions, and procedures give you reusable, enforced logic. Mastering\r

      these — and knowing the trade-offs of each — is what separates a DBA from a\r

      developer who happens to write SQL.\r"
    fr: "ACID vous donne la correction ; les clés donnent l'intégrité ; les index donnent\r

      la vitesse ; les triggers, fonctions et procédures donnent une logique\r

      réutilisable et imposée. Maîtriser tout cela — et en connaître les compromis —\r

      c'est ce qui distingue un DBA d'un développeur qui écrit du SQL par hasard.\r"
    lb: "ACID gëtt Iech Korrektheet; Schlësselen ginn Integritéit; Indexe ginn Tempo;\r

      Triggers, Funktiounen a Prozedure ginn eng widderverwendbar, duerchgesat Logik.\r

      Dat alles ze beherrschen — an d'Kompromësser ze kennen — ënnerscheet en DBA vun\r

      engem Entwéckler, deen zoufälleg SQL schreift.\r"
solid-principles-in-practice:
  para-the-solid-principles-are:
    en: "The **SOLID** principles are a set of five design guidelines that help produce\r

      maintainable, scalable software.\r"
    fr: "Les principes **SOLID** sont un ensemble de cinq règles de conception qui aident\r

      à produire des logiciels maintenables et évolutifs.\r"
    lb: "D'**SOLID**-Prinzipie sinn e Set vu fënnef Design-Regelen, déi hëllefen,\r

      erhalbar a skaléierbar Software ze produzéieren.\r"
  para-principle-focus:
    en: "| Principle | Focus |\r

      | --------- | ----- |\r

      | **S**RP | One reason to change |\r

      | **O**CP | Open for extension, closed for modification |\r

      | **L**SP | Subtypes must be substitutable |\r

      | **I**SP | Small, focused interfaces |\r

      | **D**IP | Depend on abstractions, not concretions |\r"
    fr: "| Principe | Objectif |\r

      | -------- | -------- |\r

      | **S**RP | Une seule raison de changer |\r

      | **O**CP | Ouvert à l'extension, fermé à la modification |\r

      | **L**SP | Les sous-types doivent être substituables |\r

      | **I**SP | Des interfaces petites et ciblées |\r

      | **D**IP | Dépendre des abstractions, pas des implémentations |\r"
    lb: "| Prinzip | Fokus |\r

      | ------- | ----- |\r

      | **S**RP | Nëmmen ee Grond fir ze änneren |\r

      | **O**CP | Oppen fir Extensioun, zou fir Ännerung |\r

      | **L**SP | Subtypen mussen austauschbar sinn |\r

      | **I**SP | Kleng, geziilt Interfaces |\r

      | **D**IP | Vun Abstraktiounen ofhänken, net vu Konkretiounen |\r"
  single-responsibility:
    en: "## Single Responsibility\r"
    fr: "## Responsabilité unique\r"
    lb: "## Single Responsibility\r"
  para-a-class-should-have:
    en: "A class should have only one reason to change.\r"
    fr: "Une classe ne doit avoir qu'une seule raison de changer.\r"
    lb: "Eng Klass soll nëmmen ee Grond hunn, fir sech z'änneren.\r"
  para-split-print-into-a:
    en: "Split `print()` into a dedicated `InvoicePrinter` class and each concern evolves\r

      independently.\r"
    fr: "Extraire `print()` dans une classe dédiée `InvoicePrinter` permet à chaque\r

      préoccupation d'évoluer indépendamment.\r"
    lb: "Splitt `print()` an eng eege `InvoicePrinter`-Klass an all Concern kann sech\r

      onofhängeg weiderentwéckelen.\r"
  open-closed-principle:
    en: "## Open/Closed Principle\r"
    fr: "## Principe ouvert/fermé (OCP)\r"
    lb: "## Open/Closed Principle (OCP)\r"
  para-a-module-should-be:
    en: "A module should be open for extension but closed for modification — new behavior\r

      arrives by adding code, not by rewriting existing code.\r"
    fr: "Un module doit être ouvert à l'extension mais fermé à la modification — le\r

      nouveau comportement s'ajoute en écrivant du code, pas en réécrivant l'existant.\r"
    lb: "E Modul soll oppen fir Extensioun sinn, awer zou fir Ännerung — neit Verhalen\r

      kënnt duerch neie Code derbäi, net duerch Ëmschreiwe vum existéierende.\r"
  para-adding-a-new-discount:
    en: "Adding a new discount type means adding a class; the existing ones stay untouched.\r"
    fr: "Ajouter un nouveau type de remise revient à ajouter une classe ; les existantes\r

      restent intactes.\r"
    lb: "Eng nei Remiss-Art derbäisetzen heescht eng nei Klass derbäisetzen; déi\r

      existéierend bleiwen onverännert.\r"
  liskov-substitution:
    en: "## Liskov Substitution\r"
    fr: "## Substitution de Liskov (LSP)\r"
    lb: "## Liskov Substitution (LSP)\r"
  para-objects-of-a-subtype:
    en: "Objects of a subtype should be usable anywhere the parent type is expected,\r

      without surprising behavior.\r"
    fr: "Les objets d'un sous-type doivent pouvoir être utilisés partout où le type parent\r

      est attendu, sans comportement surprenant.\r"
    lb: "Objeten vun engem Subtyp mussen iwwerall gebraucht kënne ginn, wou den Elterentyp\r

      erwaart gëtt, ouni iwwerraschend Verhalen.\r"
  para-a-square-is-not:
    en: "A `Square` is not a faithful substitute for `Rectangle` — resizing one side\r

      silently changes the other. Model them separately or behind a common abstraction.\r"
    fr: "Un `Square` n'est pas un substitut fidèle de `Rectangle` — redimensionner un côté\r

      modifie silencieusement l'autre. Modélisez-les séparément ou derrière une\r

      abstraction commune.\r"
    lb: "E `Square` ass keen treien Ersatz fir e `Rectangle` — eng Säit änneren ännert\r

      heimlech och déi aner. Modelléiert se getrennt oder hannert enger gemeinsamer\r

      Abstraktioun.\r"
  interface-segregation:
    en: "## Interface Segregation\r"
    fr: "## Ségrégation des interfaces (ISP)\r"
    lb: "## Interface Segregation (ISP)\r"
  para-a-client-should-not:
    en: "A client should not be forced to depend on methods it never uses. Prefer several\r

      narrow interfaces over one broad one.\r"
    fr: "Un client ne doit pas être forcé de dépendre de méthodes qu'il n'utilise jamais.\r

      Préférez plusieurs interfaces étroites à une seule interface large.\r"
    lb: "E Client soll net gezwonge sinn, vu Methoden ofzehänken, déi en ni benotzt.\r

      Léiwer méi schmuel Interfaces wéi eent breet.\r"
  para-now-each-class-implements:
    en: "Now each class implements only what it actually needs.\r"
    fr: "Désormais, chaque classe n'implémente que ce dont elle a réellement besoin.\r"
    lb: "Elo implementéiert all Klass nëmmen dat, wat se wierklech brauch.\r"
  dependency-inversion:
    en: "## Dependency Inversion\r"
    fr: "## Inversion des dépendances\r"
    lb: "## Dependency Inversion\r"
  para-high-level-modules-should-not:
    en: "High-level modules should not depend on low-level modules. Both should depend on\r

      abstractions.\r"
    fr: "Les modules de haut niveau ne doivent pas dépendre des modules de bas niveau.\r

      Tous deux doivent dépendre d'abstractions.\r"
    lb: "Héich-Niveau-Module sollen net vun Déif-Niveau-Modulen ofhänken. Béid sollen\r

      vun Abstraktiounen ofhänken.\r"
  para-this-keeps-business-logic:
    en: "This keeps business logic testable and decoupled from the clock.\r"
    fr: "La logique métier reste ainsi testable et découplée de l'horloge.\r"
    lb: "D'Business-Logik bleift esou testbar an decoupled vun der Auer.\r"
  para-more-in-depth-articles-will:
    en: "More in-depth articles will follow — this one just sets the stage.\r"
    fr: "D'autres articles plus détaillés suivront — celui-ci ne fait que poser les bases.\r"
    lb: "Méi detailléiert Artikele kommen nach — dësen mécht just den Optakt.\r"
tailwind-css-for-experts:
  para-tailwind-css-v4-moved:
    en: "Tailwind CSS v4 moved to a CSS-first configuration and a faster engine. This\r

      guide covers the patterns and tools that keep a Tailwind codebase clean,\r

      scalable, and good-looking.\r"
    fr: "Tailwind CSS v4 est passé à une configuration en CSS et à un moteur plus\r

      rapide. Ce guide couvre les motifs et les outils qui gardent une base Tailwind\r

      propre, scalable et agréable à regarder.\r"
    lb: "Tailwind CSS v4 ass op eng CSS-first Configuratioun an e méi séieren Engine\r

      gewiesselt. Dëse Guide deckt d'Musteren an d'Tools of, déi eng Tailwind-Codebasis\r

      propper, skaléierbar an ugehueleg halen.\r"
  tailwind-css-v4:
    en: "## Tailwind CSS v4\r"
    fr: "## Tailwind CSS v4\r"
    lb: "## Tailwind CSS v4\r"
  para-version-4-is-configured:
    en: "Version 4 is configured entirely in CSS. There is no `tailwind.config.js`; you\r

      just import it and declare your design tokens.\r"
    fr: "La version 4 se configure entièrement en CSS. Pas de `tailwind.config.js` : vous\r

      l'importez et déclarez vos jetons de design.\r"
    lb: "Versioun 4 gëtt komplett am CSS konfiguréiert. Kee `tailwind.config.js`; Dir\r

      importéiert en einfach an deklaréiert Är Design Tokens.\r"
  para-custom-utilities-and-variants:
    en: "Custom utilities and variants are declared in the same file.\r"
    fr: "Les utilitaires et variantes personnalisés se déclarent dans le même fichier.\r"
    lb: "Eegen Utilities a Variante ginn am selwechte Fichier deklaréiert.\r"
  design-tokens:
    en: "## Design tokens\r"
    fr: "## Jetons de design\r"
    lb: "## Design Tokens\r"
  para-define-tokens-once-and:
    en: "Define tokens once and reference them everywhere, so colors and spacing stay\r

      consistent. Arbitrary values like `bg-[#6366f1]` are for one-offs, not a\r

      design system.\r"
    fr: "Définissez les jetons une fois et référencez-les partout, pour que les couleurs\r

      et les espacements restent cohérents. Les valeurs arbitraires comme\r

      `bg-[#6366f1]` sont pour les cas uniques, pas pour un design system.\r"
    lb: "Definéiert Tokens eemol a referenzéiert se iwwerall, fir datt Faarwen an\r

      Ofstänn konsequent bleiwen. Arbiträr Wäerter wéi `bg-[#6366f1]` sinn fir\r

      Eemolegkeeten, net fir en Design System.\r"
  para-then-bg-primary-500-p-18-and:
    en: "Then `bg-primary-500`, `p-18`, and `text-primary-600` all work.\r"
    fr: "Alors `bg-primary-500`, `p-18` et `text-primary-600` fonctionnent.\r"
    lb: "Da funktionéieren `bg-primary-500`, `p-18` an `text-primary-600`.\r"
  utility-first-best-practices:
    en: "## Utility-first best practices\r"
    fr: "## Bonnes pratiques utility-first\r"
    lb: "## Utility-first Best Practices\r"
  para-compose-small-utilities-instead:
    en: "Compose small utilities instead of writing bespoke CSS, but extract a pattern\r

      the moment it repeats.\r"
    fr: "Composez de petits utilitaires plutôt que d'écrire du CSS sur mesure, mais\r

      extrayez un motif dès qu'il se répète.\r"
    lb: "Komponéiert kleng Utilities amplaz eegent CSS ze schreiwen, awer extrahéiert e\r

      Muster, soubal et sech widderhëlt.\r"
  para-rules-that-keep-it:
    en: "Rules that keep it maintainable:\r"
    fr: "Règles pour rester maintenable :\r"
    lb: "Reegele fir et erhalbar ze halen:\r"
  list-reuse-tokens-not-raw-values:
    en: "- Reuse tokens, not raw values.\r

      - Sort classes automatically (see the Prettier plugin below).\r

      - Prefer `gap`/`space-*` over manual margins.\r

      - Keep responsive and state variants close to the base classes.\r"
    fr: "- Réutilisez les jetons, pas les valeurs brutes.\r

      - Triez les classes automatiquement (voir le plugin Prettier ci-dessous).\r

