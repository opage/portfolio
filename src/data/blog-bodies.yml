    fr: "Préférez `readonly`, `as const` et les méthodes non mutantes pour que les\r

      changements d'état soient explicites.\r"
    lb: "Léiwer `readonly`, `as const` an net-mutéierend Methoden, sou datt\r

      Zoustandsännerungen explizit sinn.\r"
  esm-and-tree-shaking:
    en: "### ESM and tree-shaking\r"
    fr: "### ESM et tree-shaking\r"
    lb: "### ESM an Tree-Shaking\r"
  para-use-es-modules-and:
    en: "Use ES modules and named imports so bundlers can drop unused code, and prefer\r

      type-only imports so types never leak into runtime bundles.\r"
    fr: "Utilisez les modules ES et les imports nommés pour que les bundlers puissent\r

      supprimer le code inutilisé, et préférez les imports de type pour que les types\r

      ne s'infiltrent jamais dans les bundles d'exécution.\r"
    lb: "Benotzt ES-Moduler an named Imports, fir datt Bundler onbenotzte Code kënnen\r

      ewechhuelen, a léiwer Type-Only-Imports, fir datt Typpen ni an d'Runtime-Bundles\r

      kommen.\r"
  wrapping-up:
    en: "## Wrapping up\r"
    fr: "## Pour conclure\r"
    lb: "## Zum Schluss\r"
  para-the-modern-front-end-expert:
    en: "The modern front-end expert leans on the sharp new JavaScript APIs for data\r

      handling, and on TypeScript's discriminated unions, utility types, and result\r

      types to push errors to compile time. Adopt these patterns and your code gets\r

      smaller, safer, and far easier to reason about.\r"
    fr: "L'expert front-end moderne s'appuie sur les nouvelles API JavaScript pour le\r

      traitement des données, et sur les unions discriminées, les types utilitaires et\r

      les types Result de TypeScript pour repousser les erreurs à la compilation.\r

      Adoptez ces motifs et votre code devient plus petit, plus sûr et bien plus\r

      facile à raisonner.\r"
    lb: "De modernen Front-End-Expert verléisst sech op déi nei JavaScript-APIen fir\r

      Dateveraarbechtung, an op TypeScript seng Discriminated Unions, Utility Types a\r

      Result Types, fir Feeler op d'Compile-Zäit ze verleeën. Wann Dir dës Muster\r

      adoptéiert, gëtt Äre Code méi kleng, méi sécher a vill méi einfach ze verstoen.\r"

