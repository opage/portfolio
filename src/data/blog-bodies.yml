    en: "JavaScript keeps gaining small, sharp features, and TypeScript keeps turning\r

      runtime mistakes into compile-time errors. This guide covers the parts that\r

      matter for production front-end code today, with examples.\r"
    fr: "JavaScript gagne sans cesse de petites fonctionnalités précises, et TypeScript\r

      transforme sans cesse les erreurs d'exécution en erreurs de compilation. Ce\r

      guide couvre ce qui compte pour du code front-end de production aujourd'hui,\r

      avec des exemples.\r"
    lb: "JavaScript kritt dauernd kleng, prezis Features, an TypeScript mécht aus\r

      Runtime-Feeler ëmmer méi Compile-Zäit-Feeler. Dëse Guide deckt dat of, wat haut\r

      fir Front-End-Code an der Produktioun wichteg ass, mat Beispiller.\r"
