welcome-to-my-blog:
  why-a-blog:
    en: Why a blog?
    fr: Pourquoi un blog ?
    lb: Firwat e Blog?
  para-i-built-this-space:
    en: I built this space to share the notes and lessons I gather while working on side projects and production systems. Expect deep dives on **SolidJS**, **.NET**, **Java**, **Angular**, and the tooling around them.
    fr: J'ai créé cet espace pour partager les notes et leçons que je recueille au fil de mes projets personnels et de mes missions en production. Attendez-vous à des articles de fond sur **SolidJS**, **.NET**, **Java**, **Angular** et leurs outils.
    lb: Ech hunn dëse Raum gebaut, fir d'Notizen a Lektiounen ze deelen, déi ech beim Schaffen un Nieweprojeten a Produktiounssystemer sammelen. Et gi déif Ablécker iwwer **SolidJS**, **.NET**, **Java**, **Angular** an d'Tools dohannert.
  markdown-power:
    en: Markdown power
    fr: La puissance du Markdown
    lb: D'Kraaft vu Markdown
  para-articles-are-written-as:
    en: "Articles are written as plain Markdown files, so I can focus on content. The renderer supports the usual suspects out of the box:"
    fr: "Les articles sont rédigés en Markdown, ce qui me permet de me concentrer sur le contenu. Le moteur de rendu prend en charge l'essentiel :"
    lb: "D'Artikele ginn als Markdown geschriwwen, sou datt ech mech op den Inhalt konzentréiere kann. De Renderer ënnerstëtzt dat Wichtegst:"
  list-headings-lists-and-blockquotes:
    en: Headings, lists, and blockquotes
    fr: Titres, listes et citations
    lb: Iwwerschrëften, Lëschten an Zitater
  list-tables:
    en: Tables
    fr: Tableaux
    lb: Tabellen
  list-links-and-images:
    en: Links and images
    fr: Liens et images
    lb: Linken a Biller
  list-fenced-code-blocks-with-syntax-highlighting:
    en: Fenced code blocks with **syntax highlighting**
    fr: Blocs de code avec **coloration syntaxique**
    lb: Code-Bléck mat **Syntax-Highlighting**
  list-mermaid-diagrams:
    en: "**Mermaid** diagrams"
    fr: Diagrammes **Mermaid**
    lb: "**Mermaid**-Diagrammer"
  syntax-highlighting:
    en: Syntax highlighting
    fr: Coloration syntaxique
    lb: Syntax-Highlighting
  para-code-blocks-are-highlighted:
    en: "Code blocks are highlighted automatically based on the language tag:"
    fr: "Les blocs de code sont colorés automatiquement selon le langage indiqué :"
    lb: "Code-Bléck ginn automatesch no der Sprooch gefierft:"
  mermaid-diagrams:
    en: Mermaid diagrams
    fr: Diagrammes Mermaid
    lb: Mermaid-Diagrammer
  para-diagrams-render-from-a:
    en: "Diagrams render from a `mermaid` code block:"
    fr: "Les diagrammes sont rendus à partir d'un bloc `mermaid` :"
    lb: "Diagrammer ginn aus engem `mermaid`-Block gerëndert:"
  para-sequence-diagrams-work-too:
    en: "Sequence diagrams work too:"
    fr: "Les diagrammes de séquence fonctionnent aussi :"
    lb: "Sequenz-Diagrammer funktionéieren och:"
  wrapping-up:
    en: Wrapping up
    fr: Pour finir
    lb: Zum Schluss
  para-that-is-the-basics:
    en: That is the basics. Stay tuned for more detailed technical articles.
    fr: Voilà l'essentiel. Restez à l'écoute pour des articles techniques plus détaillés.
    lb: Dat war d'Basis. Bleift drun fir méi detailléiert technesch Artikelen.
angular-for-experts:
  para-angular-has-changed-a:
    en: "Angular has changed a lot in the last few versions. If you last wrote an app\r

      with `NgModule`, `*ngIf`, and `@Injectable` constructors, much of that is now\r

      optional. This guide covers what a modern, expert-level Angular codebase looks\r

      like today.\r"
    fr: "Angular a beaucoup évolué ces dernières versions. Si vous avez écrit votre\r

      dernière application avec `NgModule`, `*ngIf` et des constructeurs `@Injectable`,\r

      une grande partie de tout cela est désormais optionnelle. Ce guide présente ce\r

      à quoi ressemble aujourd'hui un code Angular moderne, de niveau expert.\r"
    lb: "Angular huet sech an de leschte Versiounen däitlech verännert. Wann Dir Är\r

      lescht App mat `NgModule`, `*ngIf` a `@Injectable`-Konstruktore geschriwwen hutt,\r

      ass vill dovu mëttlerweil fakultativ. Dëse Guide weist, wéi e modernen,\r

      expertniveau Angular-Code haut ausgesäit.\r"
  standalone-components:
    en: "## Standalone components\r"
    fr: "## Composants standalone\r"
    lb: "## Standalone-Komponenten\r"
  para-ngmodule-is-now-optional:
    en: "`NgModule` is now optional. Components, directives, and pipes declare their own\r

      dependencies with `imports`, and you wire the app with `provide*` functions.\r"
    fr: "`NgModule` est désormais optionnel. Les composants, directives et pipes\r

      déclarent leurs propres dépendances via `imports`, et l'application se câble\r

      avec des fonctions `provide*`.\r"
    lb: "`NgModule` ass elo fakultativ. Komponenten, Direktiven a Pipes deklaréieren hir\r

      eege Ofhängegkeeten iwwer `imports`, an d'App gëtt mat `provide*`-Funktiounen\r

      verdrout.\r"
  signals-the-reactivity-core:
    en: "## Signals: the reactivity core\r"
    fr: "## Les signals : le cœur de la réactivité\r"
    lb: "## Signals: de Kär vun der Reaktivitéit\r"
  para-signals-replaced-most-of:
    en: "Signals replaced most of the old `ChangeDetectionStrategy` ceremony. They are\r

      the foundation for inputs, outputs, and derived state.\r"
    fr: "Les signals remplacent la plupart de l'ancien cérémonial de\r

      `ChangeDetectionStrategy`. Ils sont le fondement des inputs, des outputs et de\r

      l'état dérivé.\r"
    lb: "Signals ersetzen de gréissten Deel vum alen `ChangeDetectionStrategy`-Zeremoniell.\r

      Si sinn d'Fundament fir Inputs, Outputs an ofgeleet Zoustand.\r"
  para-modern-two-way-binding-uses:
    en: "Modern two-way binding uses `model()`, and queries use `viewChild` /\r

      `contentChild` returning signals:\r"
    fr: "Le binding bidirectionnel moderne utilise `model()`, et les requêtes utilisent\r

      `viewChild` / `contentChild` qui renvoient des signals :\r"
    lb: "Modernt Zwee-Wee-Binding benotzt `model()`, an Queryen benotzen `viewChild` /\r

      `contentChild`, déi Signals zeréckginn:\r"
  para-for-asynchronous-data-resource:
    en: "For asynchronous data, `resource()` replaces the manual \"loading state + fetch\"\r

      dance:\r"
    fr: "Pour les données asynchrones, `resource()` remplace la danse manuelle\r

      « état de chargement + fetch » :\r"
    lb: "Fir asynchron Daten ersetzt `resource()` den manuelle « Lued-Zoustand + Fetch »\r

      -Danz:\r"
  para-resource-exposes-value-status:
    en: "`resource()` exposes `value()`, `status()`, `isLoading()`, and `error()`, so the\r

      template can react to every loading phase.\r"
    fr: "`resource()` expose `value()`, `status()`, `isLoading()` et `error()`, pour que\r

      le template puisse réagir à chaque phase de chargement.\r"
    lb: "`resource()` stellt `value()`, `status()`, `isLoading()` an `error()` zur\r

      Verfügung, sou datt den Template op all Lued-Phas reagéiere kann.\r"
  built-in-control-flow-and-deferred-loading:
    en: "## Built-in control flow and deferred loading\r"
    fr: "## Flux de contrôle natif et chargement différé\r"
    lb: "## Kontrollfloss a verspéit Lueden\r"
  para-the-old-ngif:
    en: "The old `*ngIf` / `*ngFor` structural directives are now built-in blocks that\r

      read more like plain templates.\r"
    fr: "Les anciennes directives structurelles `*ngIf` / `*ngFor` sont désormais des\r

      blocs intégrés qui se lisent comme du simple template.\r"
    lb: "Déi al strukturell Direktiven `*ngIf` / `*ngFor` sinn elo agebaute Bléck, déi\r

      sech wéi einfachen Template liesen.\r"
  para-load-heavy-pieces-only:
    en: "Load heavy pieces only when needed with `@defer`:\r"
    fr: "Ne chargez les morceaux lourds que lorsque c'est nécessaire avec `@defer` :\r"
    lb: "Lued schwéier Deeler nëmmen, wann néideg, mat `@defer`:\r"
  zoneless-change-detection:
    en: "## Zoneless change detection\r"
    fr: "## Détection de changements sans Zone.js (zoneless)\r"
    lb: "## Zoneless Ännerungsdetektioun\r"
  para-you-can-now-drop:
    en: "You can now drop Zone.js entirely. Provide zoneless detection at bootstrap and\r

      rely on signals to tell Angular what changed.\r"
    fr: "Vous pouvez désormais vous passer complètement de Zone.js. Fournissez la\r

      détection zoneless au bootstrap et laissez les signals indiquer à Angular ce qui\r

      a changé.\r"
    lb: "Dir kënnt elo komplett op Zone.js verzichten. Stellt d'Zoneless-Detektioun beim\r

      Bootstrap zur Verfügung a loosst d'Signals dem Angular soen, wat sech geännert\r

      huet.\r"
  para-zoneless-means-less-runtime:
    en: "Zoneless means less runtime overhead and fewer surprises — but it expects\r

      signal-based state and proper `OnPush`-friendly code.\r"
    fr: "Le zoneless réduit le surcoût d'exécution et les surprises — mais il attend un\r

      état basé sur les signals et du code compatible `OnPush`.\r"
    lb: "Zoneless heescht manner Laufzäit-Overhead a manner Iwwerraschungen — awer et\r

      erwaart signalbaséierten Zoustand an `OnPush`-frëndleche Code.\r"
  dependency-injection-with-inject:
    en: "## Dependency injection with inject()\r"
    fr: "## Injection de dépendances avec inject()\r"
    lb: "## Dependency Injection mat inject()\r"
  para-constructor-injection-is-replaced:
    en: "Constructor injection is replaced by the `inject()` function, which keeps code\r

      terse and plays nicely with functional APIs.\r"
    fr: "L'injection par constructeur est remplacée par la fonction `inject()`, qui rend\r

      le code concis et s'accorde avec les API fonctionnelles.\r"
    lb: "D'Konstruktor-Injektioun gëtt duerch d'`inject()`-Funktioun ersat, déi de Code\r

      kuerz hält a gutt mat funktionellen APIen zesummespillt.\r"
  routing-functional-guards-and-lazy-loading:
    en: "## Routing: functional guards and lazy loading\r"
    fr: "## Routing : guards fonctionnels et lazy loading\r"
    lb: "## Routing: funktionell Guards a Lazy Loading\r"
  para-guards-resolvers-and-interceptors:
    en: "Guards, resolvers, and interceptors are now plain functions.\r"
    fr: "Les guards, resolvers et interceptors sont désormais de simples fonctions.\r"
    lb: "Guards, Resolvers an Interceptors sinn elo einfach Funktiounen.\r"
  para-lazy-loading-is-per-route:
    en: "Lazy loading is per-route and per-component:\r"
    fr: "Le lazy loading se fait par route et par composant :\r"
    lb: "Lazy Loading geschitt pro Route a pro Komponent:\r"
  http-with-signals:
    en: "## HTTP with signals\r"
    fr: "## HTTP avec les signals\r"
    lb: "## HTTP mat Signals\r"
  para-httpclient-works-directly-with:
    en: "`HttpClient` works directly with signals, so a GET can be a reactive value.\r"
    fr: "`HttpClient` fonctionne directement avec les signals : un GET peut être une\r

      valeur réactive.\r"
    lb: "`HttpClient` funktionéiert direkt mat Signals, sou datt e GET e reaktive Wäert\r

      ka sinn.\r"
  para-for-request-scoped-loading-that:
    en: "For request-scoped loading that already lives in an `Observable`, `rxResource()`\r

      wraps `HttpClient` directly:\r"
    fr: "Pour un chargement par requête qui vit déjà dans un `Observable`, `rxResource()`\r

      enveloppe directement `HttpClient` :\r"
    lb: "Fir requestbaséiert Lueden, dat schonn an engem `Observable` lieft, wéckelt\r

      `rxResource()` den `HttpClient` direkt an:\r"
  para-rxresource-exposes-the-same:
    en: "`rxResource()` exposes the same `value()`, `status()`, `isLoading()`, and\r

      `error()` signals as `resource()`.\r"
    fr: "`rxResource()` expose les mêmes signals `value()`, `status()`, `isLoading()` et\r

      `error()` que `resource()`.\r"
    lb: "`rxResource()` stellt déi selwecht `value()`, `status()`, `isLoading()` an\r

      `error()`-Signals zur Verfügung wéi `resource()`.\r"
  state-management-with-ngrx:
    en: "## State management with NgRx\r"
    fr: "## Gestion d'état avec NgRx\r"
    lb: "## State Management mat NgRx\r"
  para-for-global-state-ngrx:
    en: "For global state, NgRx offers a signals-based **SignalStore** that fits the\r

      modern zoneless, signal-driven model.\r"
    fr: "Pour l'état global, NgRx propose un **SignalStore** basé sur les signals, qui\r

      s'intègre au modèle moderne zoneless et piloté par signals.\r"
    lb: "Fir globalen Zoustand bitt NgRx e signalbaséierte **SignalStore**, deen an de\r

      moderne zoneless, signalgedriwwene Modell passt.\r"
  para-provide-the-store-and:
    en: "Provide the store and inject it into the component:\r"
    fr: "Fournissez le store et injectez-le dans le composant :\r"
    lb: "Stellt de Store zur Verfügung an injizéiert en an de Komponent:\r"
  para-for-collections-withentities-gives:
    en: "For collections, `withEntities` gives a normalized, ready-to-use shape:\r"
    fr: "Pour les collections, `withEntities` fournit une forme normalisée prête à\r

      l'emploi :\r"
    lb: "Fir Kollektiounen liwwert `withEntities` eng normaliséiert, asazbereet Form:\r"
  para-for-complex-asynchronous-orchestration:
    en: "For complex asynchronous orchestration, the classic `@ngrx/effects` still\r

      excels; `createEffect` turns streams of actions into side effects.\r"
    fr: "Pour une orchestration asynchrone complexe, le classique `@ngrx/effects`\r

      excelle toujours ; `createEffect` transforme des flux d'actions en effets de\r

      bord.\r"
    lb: "Fir komplex asynchron Orchestréierung exceléiert de klassesche `@ngrx/effects`\r

      ëmmer nach; `createEffect` mécht aus Action-Stréim Säiteneffekter.\r"
  para-signalstore-is-the-modern:
    en: "SignalStore is the modern default for most state; reach for `@ngrx/effects`\r

      when you need advanced async flows.\r"
    fr: "SignalStore est le choix moderne par défaut pour la plupart des états ;\r

      utilisez `@ngrx/effects` quand vous avez besoin de flux asynchrones avancés.\r"
    lb: "SignalStore ass de modernen Standard fir déi meescht Zoustand; gräift op\r

      `@ngrx/effects` zeréck, wann Dir fortgeschratt asynchron Flëss braucht.\r"
  a-modern-architecture:
    en: "## A modern architecture\r"
    fr: "## Une architecture moderne\r"
    lb: "## Eng modern Architektur\r"
  para-a-clean-scalable-angular:
    en: "A clean, scalable Angular app today tends to look like this:\r"
    fr: "Une application Angular propre et scalable aujourd'hui ressemble à ceci :\r"
    lb: "Eng propper, skaléierbar Angular-App gesäit haut ongeféier sou aus:\r"
  list-standalone-everything-no-ngmodule-explicit-imports:
    en: "- **Standalone everything** — no `NgModule`, explicit `imports`.\r

      - **Signals for state** — `signal`/`computed`/`effect` plus `model`/`input`.\r

      - **`inject()`** everywhere — composable, testable services.\r

      - **Zoneless + `OnPush`** — predictable change detection.\r

      - **Functional guards/interceptors** — thin, typed routing layer.\r

      - **Lazy routes + `@defer`** — fast initial load.\r

      - **Feature-based folders** — group by domain, not by layer.\r"
    fr: "- **Tout en standalone** — pas de `NgModule`, des `imports` explicites.\r

      - **Signals pour l'état** — `signal`/`computed`/`effect` plus `model`/`input`.\r

      - **`inject()` partout** — des services composables et testables.\r

      - **Zoneless + `OnPush`** — une détection de changements prévisible.\r

      - **Guards/interceptors fonctionnels** — une couche de routing fine et typée.\r

      - **Routes lazy + `@defer`** — un chargement initial rapide.\r

      - **Dossiers par fonctionnalité** — grouper par domaine, pas par couche.\r"
    lb: "- **Alles standalone** — keen `NgModule`, explizit `imports`.\r

      - **Signals fir den Zoustand** — `signal`/`computed`/`effect` plus `model`/`input`.\r

      - **`inject()` iwwerall** — komponéierbar, testbar Servicer.\r

      - **Zoneless + `OnPush`** — virauszeseen Ännerungsdetektioun.\r

      - **Funktionell Guards/Interceptors** — eng dënn, typiséiert Routing-Schicht.\r

      - **Lazy-Routen + `@defer`** — séieren initiale Lueden.\r

      - **Ordner no Feature** — no Domain gruppéieren, net no Schicht.\r"
  version-history:
    en: "## Version history\r"
    fr: "## Historique des versions\r"
    lb: "## Versiounsgeschicht\r"
  para-a-condensed-timeline-of:
    en: "A condensed timeline of the major releases and their headline changes.\r"
    fr: "Une chronologie condensée des versions majeures et de leurs changements clés.\r"
    lb: "Eng kompakt Chronologie vun de grousse Versiounen an hire Kärännerungen.\r"
  para-version-release:
    en: "| Version | Release | Breaking changes / news |\r

      | ------- | ------- | ----------------------- |\r

      | 2.0 | Sep 2016 | Complete rewrite from AngularJS: TypeScript, components, DI |\r

      | 4.0 | Mar 2017 | Version jump (no 3.x); new `HttpClient`; animation package |\r

      | 5.0 | Nov 2017 | Build optimizer; `HttpClient` stable |\r

      | 6.0 | May 2018 | Angular CLI workspaces; RxJS 6; tree-shakable providers |\r

      | 7.0 | Oct 2018 | CLI prompts; CDK drag & drop and virtual scrolling |\r

      | 8.0 | May 2019 | Ivy (preview); differential loading; dynamic import for lazy routes |\r

      | 9.0 | Feb 2020 | Ivy enabled by default; TestBed improvements |\r

      | 10.0 | Jun 2020 | TypeScript 3.9; new date range picker |\r

      | 11.0 | Nov 2020 | Hot module replacement; stricter types |\r

      | 12.0 | May 2021 | View Engine removed; Sass modern API; strict mode default |\r

      | 13.0 | Nov 2021 | IE11 dropped; RxJS 7; no more `entryComponents` |\r

      | 14.0 | Jun 2022 | Standalone components (preview); typed reactive forms; `inject()` |\r

      | 15.0 | Nov 2022 | Standalone stable; `NgModule` optional; directive composition API |\r

      | 16.0 | May 2023 | Signals (preview); esbuild dev server; required inputs |\r

      | 17.0 | Nov 2023 | Built-in control flow; `@defer`; standalone default |\r

      | 18.0 | May 2024 | Zoneless (experimental); `@let` variables; signal inputs/outputs |\r

      | 19.0 | Nov 2024 | Signals stable; `resource()`/`rxResource()`; `linkedSignal` |\r

      | 20.0 | May 2025 | Zoneless change detection stable (default for new apps) |\r

      | 21.0 | Nov 2025 | Signal and zoneless refinements |\r"
    fr: "| Version | Sortie | Changements majeurs / breaking changes |\r

      | ------- | ------ | ------------------------------------- |\r

      | 2.0 | Sept 2016 | Réécriture complète depuis AngularJS : TypeScript, composants, DI |\r

      | 4.0 | Mars 2017 | Saut de version (pas de 3.x) ; nouveau `HttpClient` ; package d'animations |\r

      | 5.0 | Nov 2017 | Build optimizer ; `HttpClient` stable |\r

      | 6.0 | Mai 2018 | Workspaces Angular CLI ; RxJS 6 ; providers tree-shakables |\r

      | 7.0 | Oct 2018 | Prompts CLI ; drag & drop CDK et virtual scrolling |\r

      | 8.0 | Mai 2019 | Ivy (aperçu) ; differential loading ; import dynamique pour les routes lazy |\r

      | 9.0 | Fév 2020 | Ivy activé par défaut ; améliorations TestBed |\r

      | 10.0 | Juin 2020 | TypeScript 3.9 ; nouveau sélecteur de plage de dates |\r

      | 11.0 | Nov 2020 | Hot module replacement ; types plus stricts |\r

      | 12.0 | Mai 2021 | View Engine supprimé ; API moderne de Sass ; mode strict par défaut |\r

      | 13.0 | Nov 2021 | Support IE11 abandonné ; RxJS 7 ; plus d'`entryComponents` |\r

      | 14.0 | Juin 2022 | Composants standalone (aperçu) ; formulaires réactifs typés ; `inject()` |\r

      | 15.0 | Nov 2022 | Standalone stable ; `NgModule` optionnel ; directive composition API |\r

      | 16.0 | Mai 2023 | Signals (aperçu) ; serveur de dev esbuild ; inputs requis |\r

      | 17.0 | Nov 2023 | Flux de contrôle intégré ; `@defer` ; standalone par défaut |\r

      | 18.0 | Mai 2024 | Zoneless (expérimental) ; variables `@let` ; inputs/outputs signals |\r

      | 19.0 | Nov 2024 | Signals stables ; `resource()`/`rxResource()` ; `linkedSignal` |\r

      | 20.0 | Mai 2025 | Détection zoneless stable (par défaut pour les nouvelles apps) |\r

      | 21.0 | Nov 2025 | Améliorations signals et zoneless |\r"
    lb: "| Versioun | Release | Breaking Changes / Neiegkeeten |\r

      | -------- | ------- | ------------------------------ |\r

      | 2.0 | Sept 2016 | Komplett Neischreifung vun AngularJS: TypeScript, Komponenten, DI |\r

      | 4.0 | Mäerz 2017 | Versiounssprong (keng 3.x); neien `HttpClient`; Animatiouns-Package |\r

      | 5.0 | Nov 2017 | Build Optimizer; `HttpClient` stabil |\r

      | 6.0 | Mee 2018 | Angular CLI Workspaces; RxJS 6; tree-shakable Providers |\r

      | 7.0 | Okt 2018 | CLI Prompts; CDK Drag & Drop a Virtual Scrolling |\r

      | 8.0 | Mee 2019 | Ivy (Virschau); Differential Loading; dynameschen Import fir Lazy-Routen |\r

      | 9.0 | Feb 2020 | Ivy standardméisseg aktivéiert; TestBed Verbesserungen |\r

      | 10.0 | Juni 2020 | TypeScript 3.9; neien Datumsberäich-Picker |\r

      | 11.0 | Nov 2020 | Hot Module Replacement; méi streng Typpen |\r

      | 12.0 | Mee 2021 | View Engine ewechgeholl; modern Sass API; Strict Mode standardméisseg |\r

      | 13.0 | Nov 2021 | IE11 Ënnerstëtzung gestrach; RxJS 7; keng `entryComponents` méi |\r

      | 14.0 | Juni 2022 | Standalone-Komponenten (Virschau); typiséiert reaktiv Formulairen; `inject()` |\r

      | 15.0 | Nov 2022 | Standalone stabil; `NgModule` fakultativ; Directive Composition API |\r

      | 16.0 | Mee 2023 | Signals (Virschau); esbuild Dev-Server; erfuerderlech Inputs |\r

      | 17.0 | Nov 2023 | Agebaute Kontrollfloss; `@defer`; Standalone standardméisseg |\r

      | 18.0 | Mee 2024 | Zoneless (experimentell); `@let` Variabelen; Signal Inputs/Outputs |\r

      | 19.0 | Nov 2024 | Signals stabil; `resource()`/`rxResource()`; `linkedSignal` |\r

      | 20.0 | Mee 2025 | Zoneless Ännerungsdetektioun stabil (standardméisseg fir nei Apps) |\r

      | 21.0 | Nov 2025 | Signal- a Zoneless-Verfeinerungen |\r"
  wrapping-up:
    en: "## Wrapping up\r"
    fr: "## Pour conclure\r"
    lb: "## Zum Schluss\r"
  para-the-move-to-signals:
    en: "The move to signals, standalone components, and zoneless detection is the\r

      biggest shift in Angular's history. Adopting it — signals for state, `inject()`\r

      for dependencies, functional routing, and lazy loading — gives you smaller\r

      bundles, fewer change-detection bugs, and code that is far easier to reason\r

      about.\r"
    fr: "Le passage aux signals, aux composants standalone et à la détection zoneless est\r

      le plus grand bouleversement de l'histoire d'Angular. L'adopter — signals pour\r

      l'état, `inject()` pour les dépendances, routing fonctionnel et lazy loading —\r

      vous donne des bundles plus petits, moins de bugs de détection de changements et\r

      un code bien plus facile à raisonner.\r"
    lb: "De Wiessel op Signals, Standalone-Komponenten an Zoneless-Detektioun ass dee\r

      gréissten Ëmbroch an der Geschicht vum Angular. En ze adoptéieren — Signals fir\r

      den Zoustand, `inject()` fir Ofhängegkeeten, funktionell Routing a Lazy Loading —\r

      gëtt Iech méi kleng Bundles, manner Ännerungsdetektiouns-Bugs an Code, dee vill\r

      méi einfach ze verstoen ass.\r"
design-patterns-for-developers:
  para-design-patterns-are-reusable:
    en: "Design patterns are reusable solutions to common problems. They are not\r

      copy-paste templates — they are ideas you adapt to your own situation. This\r

      guide walks through ten of the most useful ones, grouped by what they do.\r"
    fr: "Les design patterns sont des solutions réutilisables à des problèmes courants.\r

      Ce ne sont pas des modèles à copier-coller — ce sont des idées que l'on adapte à\r

      sa propre situation. Ce guide présente dix des plus utiles, regroupés par rôle.\r"
    lb: "Design Patterns si widderverwendbar Léisunge fir heefeg Problemer. Si si keng\r

      Copy-Paste-Schabloune — si sinn Iddien, déi een un seng eege Situatioun upasst.\r

      Dëse Guide geet duerch zéng vun de nëtzlechsten, gruppéiert no hirer Roll.\r"
  strategy:
    en: "## Strategy\r"
    fr: "## Strategy (Stratégie)\r"
    lb: "## Strategy (Strategie)\r"
  para-the-idea-pick-an:
    en: "**The idea:** pick an algorithm at runtime without changing the code that calls\r

      it.\r"
    fr: "**L'idée :** choisir un algorithme à l'exécution sans changer le code qui\r

      l'appelle.\r"
    lb: "**D'Iddi:** en Algorithmus zur Laufzäit wielen, ouni de Code z'änneren, deen en\r

      oprifft.\r"
  para-think-of-a-checkout:
    en: "Think of a checkout page: the customer can pay by card, PayPal, or bank\r

      transfer. Each option is a different strategy behind the same button.\r"
    fr: "Pensez à une page de paiement : le client peut payer par carte, PayPal ou\r

      virement. Chaque option est une stratégie différente derrière le même bouton.\r"
    lb: "Denkt un eng Bezuel-Säit: de Client kann mat Kaart, PayPal oder Iwwerweisung\r

      bezuelen. All Optioun ass eng aner Strategie hannert dem selwechte Knäppchen.\r"
  decorator:
    en: "## Decorator\r"
    fr: "## Decorator (Décorateur)\r"
    lb: "## Decorator (Dekorateur)\r"
  para-the-idea-add-behavior:
    en: "**The idea:** add behavior to an object by wrapping it, layer by layer.\r"
    fr: "**L'idée :** ajouter un comportement à un objet en l'enveloppant, couche par\r

      couche.\r"
    lb: "**D'Iddi:** engem Objet Verhalen derbäiginn, andeems een en a Schichten ëmwéckelt.\r"
  para-like-adding-toppings-to:
    en: "Like adding toppings to a coffee: you start with an espresso and keep piling on\r

      milk, sugar, or caramel without changing the espresso itself.\r"
    fr: "Comme ajouter des suppléments à un café : on part d'un espresso et on empile le\r

      lait, le sucre ou le caramel sans modifier l'espresso lui-même.\r"
    lb: "Wéi ee Kaffi mat Extraen: een fänkt mat engem Espresso un a schicht Mëllech,\r

      Zocker oder Karamell drop, ouni den Espresso selwer z'änneren.\r"
  observer:
    en: "## Observer\r"
    fr: "## Observer (Observateur)\r"
    lb: "## Observer (Observateur)\r"
  para-the-idea-one-object:
    en: "**The idea:** one object notifies many listeners when something changes.\r"
    fr: "**L'idée :** un objet notifie plusieurs abonnés lorsqu'il change.\r"
    lb: "**D'Iddi:** en Objet informéiert méi Lauschterer, wann eppes sech ännert.\r"
  para-like-a-newsletter-people:
    en: "Like a newsletter: people subscribe, and everyone gets an update when a new\r

      edition is published.\r"
    fr: "Comme une newsletter : les gens s'abonnent et chacun reçoit une mise à jour à\r

      chaque nouvelle édition.\r"
    lb: "Wéi en Newsletter: d'Leit abonnéieren sech, an all kritt en Update, wann eng nei\r

      Editioun erauskënnt.\r"
  chain-of-responsibility:
    en: "## Chain of Responsibility\r"
    fr: "## Chaîne de responsabilité (Chain of Responsibility)\r"
    lb: "## Chain of Responsibility (Verantwortungskette)\r"
  para-the-idea-pass-a:
    en: "**The idea:** pass a request along a chain of handlers until one of them\r

      handles it.\r"
    fr: "**L'idée :** faire passer une requête le long d'une chaîne de gestionnaires\r

      jusqu'à ce que l'un d'eux la traite.\r"
    lb: "**D'Iddi:** eng Ufro laanscht eng Kette vun Handler weiderginn, bis een se\r

      behandelt.\r"
  para-like-customer-support-a:
    en: "Like customer support: a ticket is escalated level by level until someone can\r

      resolve it. Each handler decides whether to process the request or forward it.\r"
    fr: "Comme le support client : un ticket est escaladé niveau par niveau jusqu'à ce\r

      que quelqu'un puisse le résoudre. Chaque gestionnaire décide de traiter la\r

      requête ou de la transmettre.\r"
    lb: "Wéi de Clientssupport: en Ticket gëtt Niveau fir Niveau eskaléiert, bis een e\r

      léise kann. All Handler entscheet, ob en d'Ufro behandelt oder weidergëtt.\r"
  para-each-handler-only-knows:
    en: "Each handler only knows about the next one, so the chain can be reordered or\r

      extended without changing existing handlers.\r"
    fr: "Chaque gestionnaire ne connaît que le suivant, donc la chaîne peut être\r

      réordonnée ou étendue sans modifier les gestionnaires existants.\r"
    lb: "All Handler kennt nëmmen deen nächsten, sou datt d'Kette ëmgeordert oder\r

      erweidert ka ginn, ouni déi existéierend Handler z'änneren.\r"
  singleton:
    en: "## Singleton\r"
    fr: "## Singleton\r"
    lb: "## Singleton\r"
  para-the-idea-guarantee-there:
    en: "**The idea:** guarantee there is exactly one instance of a class.\r"
    fr: "**L'idée :** garantir qu'il n'existe qu'une seule instance d'une classe.\r"
    lb: "**D'Iddi:** garantéieren, datt et genee eng Instanz vun enger Klass gëtt.\r"
  para-like-a-single-settings:
    en: "Like a single settings file for an app — everyone reads the same one.\r"
    fr: "Comme un fichier de configuration unique pour une application — tout le monde\r

      lit le même.\r"
    lb: "Wéi eng eenzeg Astellungsdatei fir eng App — jidderee liest déi selwecht.\r"
  facade:
    en: "## Facade\r"
    fr: "## Facade (Façade)\r"
    lb: "## Facade (Fassad)\r"
  para-the-idea-hide-a:
    en: "**The idea:** hide a complex system behind one simple front door.\r"
    fr: "**L'idée :** masquer un système complexe derrière une porte d'entrée simple.\r"
    lb: "**D'Iddi:** e komplext System hannert enger einfacher Entrée verstoppen.\r"
  para-like-a-car-ignition:
    en: "Like a car ignition: you turn one key, and many parts work together underneath.\r"
    fr: "Comme le contact d'une voiture : on tourne une clé et de nombreux éléments\r

      travaillent ensemble en dessous.\r"
    lb: "Wéi den Zündschlëssel vun engem Auto: een dréint ee Schlëssel a vill Deeler\r

      schaffen zesummen ënnendrënner.\r"
  builder:
    en: "## Builder\r"
    fr: "## Builder (Monteur)\r"
    lb: "## Builder (Monteur)\r"
  para-the-idea-build-a:
    en: "**The idea:** build a complex object step by step instead of one giant\r

      constructor.\r"
    fr: "**L'idée :** construire un objet complexe étape par étape plutôt qu'avec un\r

      énorme constructeur.\r"
    lb: "**D'Iddi:** e komplext Objet Schrëtt fir Schrëtt bauen, amplaz mat engem risege\r

      Konstruktor.\r"
  para-like-ordering-a-custom:
    en: "Like ordering a custom burger: pick the bun, the cheese, the extras — then\r

      build it.\r"
    fr: "Comme commander un burger personnalisé : on choisit le pain, le fromage, les\r

      extras — puis on assemble.\r"
    lb: "Wéi ee personaliséierte Burger bestellen: een wielt d'Brout, de Kéis, d'Extraen\r

      — an da gëtt zesummegebaut.\r"
  adapter:
    en: "## Adapter\r"
    fr: "## Adapter (Adaptateur)\r"
    lb: "## Adapter (Adaptateur)\r"
  para-the-idea-make-two:
    en: "**The idea:** make two incompatible interfaces work together.\r"
    fr: "**L'idée :** faire fonctionner ensemble deux interfaces incompatibles.\r"
    lb: "**D'Iddi:** zwee inkompatibel Interfaces zesumme schaffe loossen.\r"
  para-like-a-travel-plug:
    en: "Like a travel plug adapter that lets your charger fit a foreign socket.\r"
    fr: "Comme un adaptateur de prise de voyage qui permet à votre chargeur de se\r

      brancher sur une prise étrangère.\r"
    lb: "Wéi e Reesstecker-Adapter, dee äre Ladegerät an eng auslännesch Steckdous\r

      passt.\r"
  mvc-model-view-controller:
    en: "## MVC (Model-View-Controller)\r"
    fr: "## MVC (Model-View-Controller)\r"
    lb: "## MVC (Model-View-Controller)\r"
  para-the-idea-separate-data:
    en: "**The idea:** separate data, presentation, and control logic.\r"
    fr: "**L'idée :** séparer les données, la présentation et la logique de contrôle.\r"
    lb: "**D'Iddi:** d'Donnéeën, d'Duerstellung an d'Steierungslogik trennen.\r"
  para-the-model-holds-the:
    en: "The **model** holds the data, the **view** shows it, and the **controller**\r

      reacts to user input.\r"
    fr: "Le **model** détient les données, la **view** les affiche et le **controller**\r

      réagit aux actions de l'utilisateur.\r"
    lb: "De **Model** hält d'Donnéeën, d'**View** weist se un, an de **Controller**\r

      reagéiert op d'Aktiounen vum Benotzer.\r"
  mvvm-model-view-viewmodel:
    en: "## MVVM (Model-View-ViewModel)\r"
    fr: "## MVVM (Model-View-ViewModel)\r"
    lb: "## MVVM (Model-View-ViewModel)\r"
  para-the-idea-bind-the:
    en: "**The idea:** bind the view directly to a **view model**, so the UI updates\r

      automatically when data changes.\r"
    fr: "**L'idée :** lier directement la vue à un **view model**, afin que l'interface se\r

      mette à jour automatiquement quand les données changent.\r"
    lb: "**D'Iddi:** d'View direkt un e **ViewModel** bannen, sou datt d'Interface sech\r

      automatesch aktualiséiert, wann d'Donnéeë sech änneren.\r"
  para-popular-in-desktop-and:
    en: "Popular in desktop and mobile apps, where a button click changes a property and\r

      the screen reflects it without manual wiring.\r"
    fr: "Populaire dans les applications desktop et mobiles : un clic modifie une\r

      propriété et l'écran le reflète sans câblage manuel.\r"
    lb: "Beléift an Desktop- a Mobil-Applikatiounen: ee Klick ännert eng Propriétéit an\r

      den Ecran spigelt dat, ouni manuell Verdrotung.\r"
  cqrs-command-query-responsibility-segregation:
    en: "## CQRS (Command Query Responsibility Segregation)\r"
    fr: "## CQRS (Séparation commande/requête)\r"
    lb: "## CQRS (Trennung vu Kommando an Ufro)\r"
  para-the-idea-separate-writes:
    en: "**The idea:** separate writes (commands) from reads (queries).\r"
    fr: "**L'idée :** séparer les écritures (commandes) des lectures (requêtes).\r"
    lb: "**D'Iddi:** d'Schreiwen (Kommandoen) vum Liesen (Ufroen) trennen.\r"
  para-reads-and-writes-often:
    en: "Reads and writes often need different models and different storage. Splitting\r

      them keeps each side simple and scalable.\r"
    fr: "Les lectures et les écritures ont souvent besoin de modèles et de stockages\r

      différents. Les séparer garde chaque côté simple et scalable.\r"
    lb: "Liesen a Schreiwen brauchen dacks ënnerschiddlech Modeller a Späicheren. Se ze\r

      trennen hält all Säit einfach a skaléierbar.\r"
  event-sourcing:
    en: "## Event Sourcing\r"
    fr: "## Event Sourcing (Sourcing d'événements)\r"
    lb: "## Event Sourcing (Event-Sourcing)\r"
  para-the-idea-store-every:
    en: "**The idea:** store every state change as an immutable event, and rebuild the\r

      current state by replaying those events.\r"
    fr: "**L'idée :** stocker chaque changement d'état comme un événement immuable, et\r

      reconstruire l'état courant en rejouant ces événements.\r"
    lb: "**D'Iddi:** all Zoustandsännerung als immutabel Event späicheren, an den\r

      aktuellen Zoustand nei opbauen, andeems een dës Eventen nei ofspillt.\r"
  para-instead-of-saving-the:
    en: "Instead of saving the current balance, you save \"deposited 100\", \"withdrew 40\".\r

      The balance is a projection you can recompute at any time.\r"
    fr: "Au lieu d'enregistrer le solde actuel, vous enregistrez « déposé 100 »,\r

      « retiré 40 ». Le solde est une projection que vous pouvez recalculer à tout\r

      moment.\r"
    lb: "Amplaz deen aktuelle Saldo ze späicheren, späichert Dir « 100 ageluecht »,\r

      « 40 ofgehuewen ». De Saldo ass eng Projektioun, déi Dir zu all Moment nei\r

      bereche kënnt.\r"
  para-event-sourcing-gives-you:
    en: "Event sourcing gives you a full audit trail, makes state reproducible, and\r

      pairs naturally with CQRS — but it costs more storage and complexity.\r"
    fr: "Le sourcing d'événements offre une piste d'audit complète, rend l'état\r

      reproductible et se marie naturellement avec CQRS — mais il coûte plus de\r

      stockage et de complexité.\r"
    lb: "Event Sourcing gëtt Iech eng komplett Audit-Spur, mécht den Zoustand\r

      reproduzéierbar a passt natierlech mat CQRS zesummen — mee et kascht méi\r

      Späicher a Komplexitéit.\r"
  wrapping-up:
    en: "## Wrapping up\r"
    fr: "## Pour conclure\r"
    lb: "## Zum Schluss\r"
  para-you-will-not-use:
    en: "You will not use every pattern every day — but recognising them helps you read\r

      other people's code, discuss designs clearly, and pick the right tool when a\r

      problem looks familiar.\r"
    fr: "Vous n'utiliserez pas chaque pattern tous les jours — mais les reconnaître vous\r

      aide à lire le code des autres, à discuter clairement des conceptions et à\r

      choisir le bon outil quand un problème vous semble familier.\r"
    lb: "Dir wäert net all Pattern all Dag benotzen — awer se erëmzefannen hëlleft Iech,\r

      de Code vun aneren ze liesen, iwwer Designen kloer ze diskutéieren an dat\r

      richtegt Handwierksgeschir ze wielen, wann e Problem Iech vertraut virkënnt.\r"
designing-a-ci-cd-pipeline:
  para-automating-your-delivery-pipeline:
    en: "Automating your delivery pipeline removes manual steps and makes every merge\r

      reproducible. Here is the pipeline I use for side projects.\r"
    fr: "Automatiser votre pipeline de livraison supprime les étapes manuelles et rend\r

      chaque merge reproductible. Voici le pipeline que j'utilise pour mes projets\r

      personnels.\r"
    lb: "Äre Delivery-Pipeline ze automatiséieren ewechzehuelen manuell Schrëtt a mécht\r

      all Merge reproduzéierbar. Hei ass de Pipeline, deen ech fir Nieweprojeten\r

      benotzen.\r"
  overview:
    en: "## Overview\r"
    fr: "## Vue d'ensemble\r"
    lb: "## Iwwerbléck\r"
  the-workflow-file:
    en: "## The workflow file\r"
    fr: "## Le fichier de workflow\r"
    lb: "## D'Workflow-Datei\r"
  release-process:
    en: "## Release process\r"
    fr: "## Processus de release\r"
    lb: "## Release-Prozess\r"
  para-releases-are-cut-from:
    en: "Releases are cut from tags and follow a staged rollout.\r"
    fr: "Les releases sont créées à partir de tags et suivent un déploiement progressif.\r"
    lb: "Releases ginn aus Tags geschnidden a verfollegen e stufenweise Rollout.\r"
  rollback-sequence:
    en: "## Rollback sequence\r"
    fr: "## Séquence de rollback\r"
    lb: "## Rollback-Sequenz\r"
  para-if-a-release-breaks:
    en: "If a release breaks, the rollback is fully automated.\r"
    fr: "Si une release casse, le rollback est entièrement automatisé.\r"
    lb: "Wann eng Release brécht, ass de Rollback komplett automatiséiert.\r"
  para-keep-the-pipeline-fast:
    en: "Keep the pipeline fast, deterministic, and observable — everything else follows.\r"
    fr: "Gardez le pipeline rapide, déterministe et observable — tout le reste suit.\r"
    lb: "Haalt de Pipeline séier, deterministesch an observéierbar — alles anert kënnt\r

      dann eleng.\r"
java-spring-ecosystem-for-experts:
  para-java-keeps-getting-more:
    en: "Java keeps getting more concise, and the Spring ecosystem keeps removing\r

      boilerplate. This guide covers the language features and Spring modules an\r

      expert backend developer uses every day, then closes with a version timeline.\r"
    fr: "Java ne cesse de devenir plus concis, et l'écosystème Spring ne cesse de\r

      supprimer le boilerplate. Ce guide couvre les fonctionnalités du langage et les\r

      modules Spring qu'un développeur backend expert utilise au quotidien, puis se\r

      termine par une chronologie des versions.\r"
    lb: "Java gëtt ëmmer méi kompakt, an den Spring-Ecosystem hëlt ëmmer méi Boilerplate\r

      ewech. Dëse Guide deckt d'Sproochfeatures an d'Spring-Moduler of, déi en\r

      Expert-Backend-Entwéckler all Dag benotzt, a schléisst mat enger\r

      Versiounschronologie.\r"
  modern-java:
    en: "## Modern Java\r"
    fr: "## Java moderne\r"
    lb: "## Modernt Java\r"
  lambdas:
    en: "### Lambdas\r"
    fr: "### Lambdas\r"
    lb: "### Lambdas\r"
  para-a-lambda-is-a:
    en: "A lambda is a compact implementation of a functional interface (an interface\r

      with a single abstract method). It powers the Stream API and Spring's\r

      functional DSLs.\r"
    fr: "Un lambda est une implémentation compacte d'une interface fonctionnelle (une\r

      interface à une seule méthode abstraite). Il alimente l'API Stream et les DSL\r

      fonctionnels de Spring.\r"
    lb: "E Lambda ass eng kompakt Ëmsetzung vun engem funktionellen Interface (en\r

      Interface mat enger eenzeger abstrakter Method). Et dreift d'Stream API an déi\r

      funktionell DSLen vu Spring.\r"
  para-the-jdk-ships-the:
    en: "The JDK ships the common functional interfaces, so you rarely write your own.\r"
    fr: "Le JDK fournit les interfaces fonctionnelles courantes, vous en écrivez donc\r

      rarement.\r"
    lb: "D'JDK liwwert déi heefeg funktionell Interfaces, Dir schreift se also selten.\r"
  streams:
    en: "### Streams\r"
    fr: "### Streams\r"
    lb: "### Streams\r"
  para-a-stream-is-a:
    en: "A stream is a pipeline over a collection: a source, a chain of lazy\r

      intermediate operations, and one terminal operation that runs it.\r"
    fr: "Un stream est un pipeline sur une collection : une source, une chaîne\r

      d'opérations intermédiaires paresseuses, et une opération terminale qui\r

      l'exécute.\r"
    lb: "E Stream ass e Pipeline iwwer eng Kollektioun: eng Quell, eng Kette vu faulen\r

      Zwëschenoperatiounen, an eng terminal Operatioun, déi e leeft.\r"
  para-common-terminal-operations:
    en: "Common terminal operations:\r"
    fr: "Opérations terminales courantes :\r"
    lb: "Heefeg terminal Operatiounen:\r"
  para-filter-map-sorted-distinct:
    en: "`filter`, `map`, `sorted`, `distinct`, and `limit` are lazy; `toList`,\r

      `collect`, `reduce`, and `forEach` trigger the pipeline. Streams encourage\r

      immutable, declarative data processing.\r"
    fr: "`filter`, `map`, `sorted`, `distinct` et `limit` sont paresseuses ; `toList`,\r

      `collect`, `reduce` et `forEach` déclenchent le pipeline. Les streams\r

      encouragent un traitement de données immuable et déclaratif.\r"
    lb: "`filter`, `map`, `sorted`, `distinct` a `limit` si faul; `toList`, `collect`,\r

      `reduce` a `forEach` starten de Pipeline. Streams encouragéieren immutable,\r

      deklarativ Dateveraarbechtung.\r"
  records:
    en: "### Records\r"
    fr: "### Records\r"
    lb: "### Records\r"
  para-records-give-you-immutable:
    en: "Records give you immutable data carriers with no boilerplate.\r"
    fr: "Les records offrent des porteurs de données immuables sans boilerplate.\r"
    lb: "Records ginn Iech immutable Daten-Droen ouni Boilerplate.\r"
  pattern-matching:
    en: "### Pattern matching\r"
    fr: "### Pattern matching\r"
    lb: "### Pattern Matching\r"
  para-instanceof-narrows-the-variable:
    en: "`instanceof` narrows the variable in place.\r"
    fr: "`instanceof` rétrécit la variable sur place.\r"
    lb: "`instanceof` schränkt d'Variabel direkt an.\r"
  para-switch-expressions-combine-with:
    en: "Switch expressions combine with pattern matching for exhaustive, typed logic.\r"
    fr: "Les expressions switch se combinent au pattern matching pour une logique typée\r

      et exhaustive.\r"
    lb: "Switch Expressions kombinéiere sech mam Pattern Matching fir exhaustiv,\r

      typiséiert Logik.\r"
  sealed-classes:
    en: "### Sealed classes\r"
    fr: "### Classes scellées\r"
    lb: "### Sealed Classes\r"
  para-sealed-hierarchies-declare-every:
    en: "Sealed hierarchies declare every allowed subtype, so the compiler can check\r

      exhaustiveness.\r"
    fr: "Les hiérarchies scellées déclarent chaque sous-type autorisé, pour que le\r

      compilateur puisse vérifier l'exhaustivité.\r"
    lb: "Sealed Hierarchie deklaréieren all erlaabten Ënnertyp, sou datt de Compiler\r

      d'Exhaustivitéit ka kontrolléieren.\r"
  virtual-threads:
    en: "### Virtual threads\r"
    fr: "### Threads virtuels\r"
    lb: "### Virtuell Threads\r"
  para-project-loom-stable-since:
    en: "Project Loom (stable since Java 21) makes blocking code scale with cheap,\r

      lightweight threads.\r"
    fr: "Le projet Loom (stable depuis Java 21) fait évoluer le code bloquant avec des\r

      threads légers et peu coûteux.\r"
    lb: "De Projet Loom (stabil zënter Java 21) léisst blockéierende Code mat liichten,\r

      bëllege Threads skaléieren.\r"
  spring-boot:
    en: "## Spring Boot\r"
    fr: "## Spring Boot\r"
    lb: "## Spring Boot\r"
  para-spring-boot-wires-an:
    en: "Spring Boot wires an application from a single annotation and sensible\r

      defaults, configured via `application.yml`.\r"
    fr: "Spring Boot câble une application à partir d'une seule annotation et de valeurs\r

      par défaut sensées, configurées via `application.yml`.\r"
    lb: "Spring Boot verdrot eng Applikatioun aus enger eenzeger Annotatioun a vernünftege\r

      Standardwäerter, konfiguréiert iwwer `application.yml`.\r"
  para-starters-pull-in-a:
    en: "Starters pull in a whole feature (web, data, security) with one dependency, and\r

      auto-configuration adapts to what is on the classpath.\r"
    fr: "Les starters apportent toute une fonctionnalité (web, data, security) avec une\r

      seule dépendance, et l'auto-configuration s'adapte à ce qui est sur le classpath.\r"
    lb: "Starters bréngen eng ganz Funktioun (Web, Data, Security) mat enger eenzeger\r

      Ofhängegkeet, an d'Auto-Configuratioun passt sech un dat un, wat um Classpath\r

      ass.\r"
  spring-beans-and-components:
    en: "## Spring beans and components\r"
    fr: "## Beans et composants Spring\r"
    lb: "## Spring Beans a Komponenten\r"
  para-a-bean-is-any:
    en: "A **bean** is any object managed by Spring's IoC container. **Components** are\r

      classes auto-detected by component scanning through stereotype annotations.\r"
    fr: "Un **bean** est tout objet géré par le conteneur IoC de Spring. Les\r

      **composants** sont des classes auto-détectées par le scan de composants via des\r

      annotations stéréotypes.\r"
    lb: "E **Bean** ass all Objet, dee vum Spring IoC-Container geréiert gëtt.\r

      **Komponenten** si Klassen, déi duerch Component Scanning iwwer Stereotyp-\r

      Annotatiounen automatesch fonnt ginn.\r"
  para-component-is-the-generic:
    en: "`@Component` is the generic stereotype; `@Service`, `@Repository`, and\r

      `@Controller` are specializations that add meaning and future behaviour.\r"
    fr: "`@Component` est le stéréotype générique ; `@Service`, `@Repository` et\r

      `@Controller` sont des spécialisations qui ajoutent du sens et des\r

      comportements futurs.\r"
    lb: "`@Component` ass de generesche Stereotyp; `@Service`, `@Repository` an\r

      `@Controller` si Spezialisatiounen, déi Bedeitung an zukünftegt Verhalen\r

      derbäisetzen.\r"
  para-for-third-party-or-manually:
    en: "For third-party or manually constructed objects, declare a bean in a\r

      `@Configuration` class.\r"
    fr: "Pour les objets tiers ou construits manuellement, déclarez un bean dans une\r

      classe `@Configuration`.\r"
    lb: "Fir Drëtt-Partei- oder manuell gebauten Objeten, deklaréiert e Bean an enger\r

      `@Configuration`-Klass.\r"
  para-inject-dependencies-through-the:
    en: "Inject dependencies through the constructor — the modern, testable default.\r"
    fr: "Injectez les dépendances par le constructeur — le choix moderne et testable.\r"
    lb: "Injizéiert Ofhängegkeeten iwwer de Konstruktor — de modernen, testbaren\r

      Standard.\r"
  para-autowired-is-the-older:
    en: "`@Autowired` is the older, annotation-driven way. It can target fields,\r

      setters, or constructors.\r"
    fr: "`@Autowired` est l'ancienne méthode pilotée par annotations. Elle peut cibler les\r

      champs, les setters ou les constructeurs.\r"
    lb: "`@Autowired` ass déi eeler, annotatiounsgedriwwen Aart. Et kann Felder, Setteren\r

      oder Konstruktoren zielen.\r"
  para-field-and-setter-injection:
    en: "Field and setter injection are flexible but make dependencies mutable and\r

      harder to test. Prefer constructor injection — on a single constructor,\r

      `@Autowired` is even optional.\r"
    fr: "L'injection par champ et par setter est flexible mais rend les dépendances\r

      mutables et plus difficiles à tester. Préférez l'injection par constructeur —\r

      sur un constructeur unique, `@Autowired` est même optionnel.\r"
    lb: "Feld- a Setter-Injektioun si flexibel, maachen awer Ofhängegkeeten mutabel a\r

      méi schwéier ze testen. Léiwer Konstruktor-Injektioun — bei engem eenzege\r

      Konstruktor ass `@Autowired` souguer fakultativ.\r"
  para-when-several-beans-share:
    en: "When several beans share the same type, `@Qualifier` picks the right one.\r"
    fr: "Quand plusieurs beans partagent le même type, `@Qualifier` choisit le bon.\r"
    lb: "Wann méi Beans dee selwechten Typ deelen, wielt `@Qualifier` de richtegen aus.\r"
  para-the-qualifier-is-the:
    en: "The qualifier is the bean name — by default the class name with a lowercase\r

      first letter. You can set an explicit name with `@Service(\"paypal\")` or\r

      `@Bean(\"paypal\")`.\r"
    fr: "Le qualifier est le nom du bean — par défaut le nom de classe avec une première\r

      lettre minuscule. Vous pouvez fixer un nom explicite avec `@Service(\"paypal\")`\r

      ou `@Bean(\"paypal\")`.\r"
    lb: "De Qualifier ass de Bean-Numm — standardméisseg de Klassennumm mat engem klengen\r

      éischte Buschtaf. Dir kënnt en expliziten Numm mat `@Service(\"paypal\")` oder\r

      `@Bean(\"paypal\")` setzen.\r"
  para-spring-provides-several-bean:
    en: "Spring provides several bean scopes. `singleton` (the default) creates one\r

      instance per container; `prototype` creates a new instance on every request;\r

      the web scopes (`request`, `session`, `application`, `websocket`) are tied to a\r

      web context.\r"
    fr: "Spring propose plusieurs scopes de beans. `singleton` (par défaut) crée une\r

      instance par conteneur ; `prototype` crée une nouvelle instance à chaque\r

      demande ; les scopes web (`request`, `session`, `application`, `websocket`) sont\r

      liés à un contexte web.\r"
    lb: "Spring bitt méi Bean-Scopes. `singleton` (de Standard) mécht eng Instanz pro\r

      Container; `prototype` mécht bei all Ufro eng nei Instanz; d'Web-Scopes\r

      (`request`, `session`, `application`, `websocket`) sinn un e Web-Kontext gebonnen.\r"
  para-the-short-lived-scopes-request:
    en: "The short-lived scopes (`request`, `session`, `websocket`) need\r

      `proxyMode = ScopedProxyMode.TARGET_CLASS` so they can be injected into\r

      longer-lived singletons.\r"
    fr: "Les scopes à courte durée (`request`, `session`, `websocket`) nécessitent\r

      `proxyMode = ScopedProxyMode.TARGET_CLASS` pour pouvoir être injectés dans des\r

      singletons à plus longue durée.\r"
    lb: "Déi kuerzliewend Scopes (`request`, `session`, `websocket`) brauchen\r

      `proxyMode = ScopedProxyMode.TARGET_CLASS`, fir an méi laang liewend\r

      Singletons injizéiert ze kënne ginn.\r"
  para-spring-ships-shorthand-annotations:
    en: "Spring ships shorthand annotations for the common web scopes:\r"
    fr: "Spring fournit des annotations raccourcies pour les scopes web courants :\r"
    lb: "Spring liwwert Kierzel-Annotatiounen fir déi heefeg Web-Scopes:\r"
  para-requestscope-and-sessionscope-are:
    en: "`@RequestScope` and `@SessionScope` are shortcuts for the `@Scope` version with\r

      `proxyMode = ScopedProxyMode.TARGET_CLASS`. There is no shorthand for\r

      `prototype` or `websocket` — use `@Scope` for those.\r"
    fr: "`@RequestScope` et `@SessionScope` sont des raccourcis pour la version `@Scope`\r

      avec `proxyMode = ScopedProxyMode.TARGET_CLASS`. Il n'y a pas de raccourci pour\r

      `prototype` ou `websocket` — utilisez `@Scope` pour ceux-là.\r"
    lb: "`@RequestScope` a `@SessionScope` si Kierzel fir d'`@Scope`-Versioun mat\r

      `proxyMode = ScopedProxyMode.TARGET_CLASS`. Et gëtt kee Kierzel fir `prototype`\r

      oder `websocket` — benotzt `@Scope` fir déi.\r"
  para-here-is-the-complete:
    en: "Here is the complete set:\r"
    fr: "Voici l'ensemble complet :\r"
    lb: "Hei ass de komplette Set:\r"
  para-scope-lifetime:
    en: "| Scope | Lifetime | Shorthand |\r

      | --- | --- | --- |\r

      | `singleton` | One instance per container | default |\r

      | `prototype` | New instance on every request | — |\r

      | `request` | One instance per HTTP request | `@RequestScope` |\r

      | `session` | One instance per HTTP session | `@SessionScope` |\r

      | `application` | One instance per `ServletContext` | `@ApplicationScope` |\r

      | `websocket` | One instance per WebSocket session | — |\r"
    fr: "| Scope | Durée de vie | Raccourci |\r

      | --- | --- | --- |\r

      | `singleton` | Une instance par conteneur | par défaut |\r

      | `prototype` | Nouvelle instance à chaque demande | — |\r

      | `request` | Une instance par requête HTTP | `@RequestScope` |\r

      | `session` | Une instance par session HTTP | `@SessionScope` |\r

      | `application` | Une instance par `ServletContext` | `@ApplicationScope` |\r

      | `websocket` | Une instance par session WebSocket | — |\r"
    lb: "| Scope | Liewensdauer | Kierzel |\r

      | --- | --- | --- |\r

      | `singleton` | Eng Instanz pro Container | Standard |\r

      | `prototype` | Nei Instanz bei all Ufro | — |\r

      | `request` | Eng Instanz pro HTTP-Ufro | `@RequestScope` |\r

      | `session` | Eng Instanz pro HTTP-Session | `@SessionScope` |\r

      | `application` | Eng Instanz pro `ServletContext` | `@ApplicationScope` |\r

      | `websocket` | Eng Instanz pro WebSocket-Session | — |\r"
  para-in-short-the-shorthand:
    en: "In short, the shorthand annotations are `@RequestScope`, `@SessionScope`, and\r

      `@ApplicationScope`. Spring Cloud also ships `@RefreshScope` for\r

      `@Scope(\"refresh\")`. There is no shorthand for `singleton` (the default),\r

      `prototype`, or `websocket`.\r"
    fr: "En bref, les annotations raccourcies sont `@RequestScope`, `@SessionScope` et\r

      `@ApplicationScope`. Spring Cloud fournit aussi `@RefreshScope` pour\r

      `@Scope(\"refresh\")`. Il n'y a pas de raccourci pour `singleton` (par défaut),\r

      `prototype` ou `websocket`.\r"
    lb: "Kuerz gesot, d'Kierzel-Annotatioune sinn `@RequestScope`, `@SessionScope` an\r

      `@ApplicationScope`. Spring Cloud liwwert och `@RefreshScope` fir\r

      `@Scope(\"refresh\")`. Et gëtt kee Kierzel fir `singleton` (de Standard),\r

      `prototype` oder `websocket`.\r"
  para-springbootapplication-enables-component-scanning:
    en: "`@SpringBootApplication` enables component scanning over its package, so any\r

      annotated class there is picked up automatically.\r"
    fr: "`@SpringBootApplication` active le scan de composants sur son package, donc\r

      toute classe annotée y est détectée automatiquement.\r"
    lb: "`@SpringBootApplication` aktivéiert de Component Scanning iwwer säi Package, sou\r

      datt all annotéiert Klass do automatesch opgeholl gëtt.\r"
  spring-security:
    en: "## Spring Security\r"
    fr: "## Spring Security\r"
    lb: "## Spring Security\r"
  para-security-is-configured-through:
    en: "Security is configured through a `SecurityFilterChain` bean. The lambda DSL is\r

      the modern, readable style.\r"
    fr: "La sécurité se configure via un bean `SecurityFilterChain`. Le DSL lambda est le\r

      style moderne et lisible.\r"
    lb: "Security gëtt iwwer e `SecurityFilterChain`-Bean konfiguréiert. Den Lambda-DSL ass\r

      de modernen, liesbaren Stil.\r"
  para-jwt-resource-servers-are:
    en: "JWT resource servers are the default for stateless APIs; method security\r

      (`@PreAuthorize`) guards individual service calls. Enable it with\r

      `@EnableMethodSecurity` and annotate the methods you want to protect.\r"
    fr: "Les resource servers JWT sont la norme pour les API sans état ; la sécurité par\r

      méthode (`@PreAuthorize`) protège les appels de service individuels. Activez-la\r

      avec `@EnableMethodSecurity` et annotez les méthodes à protéger.\r"
    lb: "JWT Resource Servers sinn de Standard fir stateless APIen; Method-Security\r

      (`@PreAuthorize`) schützt eenzel Service-Opruff. Aktivéiert et mat\r

      `@EnableMethodSecurity` an annotéiert d'Methoden, déi Dir schütze wëllt.\r"
  para-preauthorize-accepts-spel-so:
    en: "`@PreAuthorize` accepts SpEL, so you can check roles (`hasRole`), authorities\r

      (`hasAuthority`), or the request itself (`#id == authentication.name`). Use\r

      `@PostAuthorize` to filter the returned value after the method runs.\r"
    fr: "`@PreAuthorize` accepte SpEL : vous pouvez vérifier les rôles (`hasRole`), les\r

      autorités (`hasAuthority`) ou la requête elle-même (`#id ==\r

      authentication.name`). Utilisez `@PostAuthorize` pour filtrer la valeur\r

      retournée après l'exécution.\r"
    lb: "`@PreAuthorize` akzeptéiert SpEL: Dir kënnt Rollen (`hasRole`), Autoritéiten\r

      (`hasAuthority`) oder d'Ufro selwer (`#id == authentication.name`) prüfen.\r

      Benotzt `@PostAuthorize`, fir de zeréckginnene Wäert no der Ausféierung ze\r

      filteren.\r"
  filters-vs-interceptors:
    en: "## Filters vs interceptors\r"
    fr: "## Filtres vs interceptors\r"
    lb: "## Filter vs Interceptors\r"
  para-both-wrap-requests-but:
    en: "Both wrap requests, but at different layers. A **filter** is part of the\r

      Servlet API and runs around the entire request, before Spring's\r

      `DispatcherServlet`. An **interceptor** is Spring MVC and runs inside the\r

      dispatcher, with access to the target controller.\r"
    fr: "Les deux enveloppent les requêtes, mais à des couches différentes. Un **filtre**\r

      fait partie de l'API Servlet et s'exécute autour de toute la requête, avant le\r

      `DispatcherServlet` de Spring. Un **interceptor** est Spring MVC et s'exécute\r

      dans le dispatcher, avec accès au contrôleur cible.\r"
    lb: "Béid wéckelen Ufroen an, awer op verschiddene Schichten. E **Filter** ass Deel\r

      vun der Servlet API a leeft ronderëm déi ganz Ufro, virum Spring säin\r

      `DispatcherServlet`. En **Interceptor** ass Spring MVC a leeft am Dispatcher,\r

      mat Zougang zum Zil-Controller.\r"
  para-a-filter-is-for:
    en: "A filter is for concerns that must run before Spring even sees the request:\r"
    fr: "Un filtre sert aux préoccupations qui doivent s'exécuter avant même que Spring\r

      ne voie la requête :\r"
    lb: "E Filter ass fir Konzerner, déi musse lafen, ier Spring d'Ufro iwwerhaapt gesäit:\r"
  para-an-interceptor-is-for:
    en: "An interceptor is for concerns that need the controller, such as timing a\r

      specific handler:\r"
    fr: "Un interceptor sert aux préoccupations qui ont besoin du contrôleur, comme\r

      chronométrer un handler précis :\r"
    lb: "En Interceptor ass fir Konzerner, déi de Controller brauchen, wéi zum Beispill e\r

      bestëmmten Handler ze stoppen:\r"
  para-filter:
    en: "| | Filter | Interceptor |\r

      | --- | --- | --- |\r

      | Layer | Servlet API | Spring MVC |\r

      | Runs | Before `DispatcherServlet` | Inside `DispatcherServlet` |\r

      | Sees the controller | No | Yes (`HandlerMethod`) |\r

      | Typical uses | Auth, CORS, encoding, logging | Timing, model attributes, handler-aware logging |\r"
    fr: "| | Filtre | Interceptor |\r

      | --- | --- | --- |\r

      | Couche | API Servlet | Spring MVC |\r

      | S'exécute | Avant le `DispatcherServlet` | Dans le `DispatcherServlet` |\r

      | Voit le contrôleur | Non | Oui (`HandlerMethod`) |\r

      | Usages types | Auth, CORS, encodage, journalisation | Chronométrage, attributs de modèle, journalisation par handler |\r"
    lb: "| | Filter | Interceptor |\r

      | --- | --- | --- |\r

      | Schicht | Servlet API | Spring MVC |\r

      | Leeft | Virum `DispatcherServlet` | Am `DispatcherServlet` |\r

      | Gesäit de Controller | Nee | Jo (`HandlerMethod`) |\r

      | Typesch Notzung | Auth, CORS, Encoding, Logging | Timing, Modellattributer, handlerbewosst Logging |\r"
  para-in-short-filters-for:
    en: "In short: filters for the container level, interceptors for the MVC level.\r"
    fr: "En bref : les filtres pour le niveau conteneur, les interceptors pour le niveau\r

      MVC.\r"
    lb: "Kuerz gesot: Filtere fir d'Containerniveau, Interceptore fir d'MVC-Niveau.\r"
  restcontroller-vs-controller:
    en: "## @RestController vs @Controller\r"
    fr: "## @RestController vs @Controller\r"
    lb: "## @RestController vs @Controller\r"
  para-controller-is-the-classic:
    en: "`@Controller` is the classic MVC stereotype: its methods return a **view name**\r

      resolved by a `ViewResolver`. `@RestController` is a convenience combination of\r

      `@Controller` + `@ResponseBody`, so methods return **data** serialized to JSON.\r"
    fr: "`@Controller` est le stéréotype MVC classique : ses méthodes renvoient un **nom\r

      de vue** résolu par un `ViewResolver`. `@RestController` est la combinaison de\r

      `@Controller` + `@ResponseBody`, donc ses méthodes renvoient des **données**\r

      sérialisées en JSON.\r"
    lb: "`@Controller` ass de klasseschen MVC-Stereotyp: seng Methode ginn en **View-Numm**\r

      zeréck, dee vun engem `ViewResolver` opgeléist gëtt. `@RestController` ass\r

      d'Kombinatioun vu `@Controller` + `@ResponseBody`, sou datt seng Methode\r

      **Donnéeën** zeréckginn, déi op JSON serialiséiert ginn.\r"
  para-getmapping-postmapping-putmapping-and:
    en: "`@GetMapping`, `@PostMapping`, `@PutMapping`, and `@DeleteMapping` are\r

      shortcuts for `@RequestMapping(method = ...)`. Use `@Controller` for\r

      server-rendered pages and `@RestController` for APIs.\r"
    fr: "`@GetMapping`, `@PostMapping`, `@PutMapping` et `@DeleteMapping` sont des\r

      raccourcis pour `@RequestMapping(method = ...)`. Utilisez `@Controller` pour les\r

      pages rendues côté serveur et `@RestController` pour les API.\r"
    lb: "`@GetMapping`, `@PostMapping`, `@PutMapping` an `@DeleteMapping` si Kierzel fir\r

      `@RequestMapping(method = ...)`. Benotzt `@Controller` fir servergerendert\r

      Säiten an `@RestController` fir APIen.\r"
  spring-data-jpa:
    en: "## Spring Data JPA\r"
    fr: "## Spring Data JPA\r"
    lb: "## Spring Data JPA\r"
  para-entities-map-classes-to:
    en: "Entities map classes to tables, and repository interfaces generate the queries\r

      from method names.\r"
    fr: "Les entités mappent les classes aux tables, et les interfaces de repository\r

      génèrent les requêtes à partir des noms de méthode.\r"
    lb: "Entitéite mappen Klasse op Tabellen, an Repository-Interfaces generéieren\r

      d'Querien aus de Methodennimm.\r"
  para-pagination-uses-pageable-with:
    en: "Pagination uses `Pageable` with `Page` or `Slice`:\r"
    fr: "La pagination utilise `Pageable` avec `Page` ou `Slice` :\r"
    lb: "D'Paginéierung benotzt `Pageable` mat `Page` oder `Slice`:\r"
  para-pagerequest-of-page-size-maps-to:
    en: "`PageRequest.of(page, size)` maps to `offset = page * size` and `limit = size`.\r

      `Page` runs an extra `COUNT` query for the total; use `Slice` to skip it when you\r

      only need a \"has next\" flag.\r"
    fr: "`PageRequest.of(page, size)` correspond à `offset = page * size` et\r

      `limit = size`. `Page` exécute une requête `COUNT` supplémentaire pour le total ;\r

      utilisez `Slice` pour l'éviter quand vous n'avez besoin que d'un indicateur\r

      « a-t-il une suite ».\r"
    lb: "`PageRequest.of(page, size)` entsprécht `offset = page * size` an `limit = size`.\r

      `Page` mécht eng zousätzlech `COUNT`-Ufro fir den Total; benotzt `Slice`, fir se\r

      ze spueren, wann Dir nëmmen en « huet et eng Säit méi »-Indikateur braucht.\r"
  para-use-transactional-on-service:
    en: "Use `@Transactional` on service boundaries so multiple writes commit or roll\r

      back together.\r"
    fr: "Utilisez `@Transactional` sur les frontières de service pour que plusieurs\r

      écritures soient validées ou annulées ensemble.\r"
    lb: "Benotzt `@Transactional` op de Service-Grenzen, fir datt méi Schreibvirstellungen\r

      zesumme committéiert oder zeréckgerullt ginn.\r"
  para-if-any-step-throws:
    en: "If any step throws a `RuntimeException`, the whole method rolls back. Fine-tune\r

      it with `rollbackFor` (for checked exceptions), `readOnly = true` (for\r

      read-only queries), and `propagation` (to join or require a new transaction).\r"
    fr: "Si une étape lève une `RuntimeException`, toute la méthode est annulée.\r

      Ajustez-la avec `rollbackFor` (pour les exceptions vérifiées), `readOnly = true`\r

      (pour les requêtes en lecture seule) et `propagation` (pour rejoindre ou exiger\r

      une nouvelle transaction).\r"
    lb: "Wann ee Schrëtt eng `RuntimeException` werft, gëtt déi ganz Method zeréckgerullt.\r

      Passt et mat `rollbackFor` (fir Checked Exceptions), `readOnly = true` (fir\r

      Read-Only-Querien) a `propagation` (fir eng Transaktioun bäizetrieden oder eng\r

      nei ze verlaangen) un.\r"
  lombok-and-mapstruct:
    en: "## Lombok and MapStruct\r"
    fr: "## Lombok et MapStruct\r"
    lb: "## Lombok a MapStruct\r"
  lombok:
    en: "### Lombok\r"
    fr: "### Lombok\r"
    lb: "### Lombok\r"
  para-lombok-removes-boilerplate-with:
    en: "Lombok removes boilerplate with compile-time annotations. `@Getter`/`@Setter`\r

      generate accessors, `@Builder` a builder, and `@Slf4j` a logger.\r"
    fr: "Lombok supprime le boilerplate avec des annotations à la compilation.\r

      `@Getter`/`@Setter` génèrent les accesseurs, `@Builder` un builder et `@Slf4j`\r

      un logger.\r"
    lb: "Lombok hëlt Boilerplate mat Compile-Zäit-Annotatiounen ewech. `@Getter`/`@Setter`\r

      generéieren Accessoren, `@Builder` e Builder a `@Slf4j` e Logger.\r"
  para-requiredargsconstructor-generates-a-constructor:
    en: "`@RequiredArgsConstructor` generates a constructor for `final` fields, which\r

      pairs perfectly with constructor injection.\r"
    fr: "`@RequiredArgsConstructor` génère un constructeur pour les champs `final`, ce qui\r

      se marie parfaitement avec l'injection par constructeur.\r"
    lb: "`@RequiredArgsConstructor` generéiert e Konstruktor fir `final`-Felder, wat\r

      perfekt mat der Konstruktor-Injektioun zesummegeet.\r"
  para-data-bundles-accessors-with:
    en: "`@Data` bundles accessors with `equals`/`hashCode`/`toString`, but avoid it on\r

      JPA entities, where the generated `equals` can behave badly on mutable state.\r"
    fr: "`@Data` regroupe les accesseurs avec `equals`/`hashCode`/`toString`, mais\r

      évitez-le sur les entités JPA, où le `equals` généré peut mal se comporter sur un\r

      état mutable.\r"
    lb: "`@Data` bündelt d'Accessoren mat `equals`/`hashCode`/`toString`, awer vermeit et\r

      op JPA-Entitéiten, wou de generéierten `equals` sech op mutablem Zoustand\r

      schlecht behuele kann.\r"
  mapstruct:
    en: "### MapStruct\r"
    fr: "### MapStruct\r"
    lb: "### MapStruct\r"
  para-mapstruct-generates-type-safe-mappers:
    en: "MapStruct generates type-safe mappers between DTOs and entities at compile time.\r

      Declare an interface and it produces the implementation.\r"
    fr: "MapStruct génère des mappers typés entre DTO et entités à la compilation.\r

      Déclarez une interface et il produit l'implémentation.\r"
    lb: "MapStruct generéiert type-sécher Mapper tëscht DTOen an Entitéiten zur\r

      Compile-Zäit. Deklaréiert en Interface an et produzéiert d'Ëmsetzung.\r"
  para-with-componentmodel-spring:
    en: "With `componentModel = \"spring\"`, the mapper is a Spring bean you can inject.\r"
    fr: "Avec `componentModel = \"spring\"`, le mapper est un bean Spring injectable.\r"
    lb: "Mat `componentModel = \"spring\"` ass de Mapper e Spring Bean, deen Dir injizéiere\r

      kënnt.\r"
  para-unlike-reflection-based-mappers-mapstruct:
    en: "Unlike reflection-based mappers, MapStruct is type-safe and fails at compile\r

      time when fields do not match.\r"
    fr: "Contrairement aux mappers à réflexion, MapStruct est type-safe et échoue à la\r

      compilation quand les champs ne correspondent pas.\r"
    lb: "Am Géigesaz zu Reflexiouns-Mapper ass MapStruct type-sécher a feelt zur\r

      Compile-Zäit, wann d'Felder net iwwereneestëmmen.\r"
  spring-cloud-stream-with-the-kafka-binder:
    en: "## Spring Cloud Stream with the Kafka binder\r"
    fr: "## Spring Cloud Stream avec le binder Kafka\r"
    lb: "## Spring Cloud Stream mam Kafka Binder\r"
  para-cloud-stream-abstracts-the:
    en: "Cloud Stream abstracts the messaging infrastructure behind a binding model, so\r

      your code speaks functions, not Kafka clients.\r"
    fr: "Cloud Stream abstrait l'infrastructure de messagerie derrière un modèle de\r

      binding, de sorte que votre code parle fonctions, pas clients Kafka.\r"
    lb: "Cloud Stream abstrahéiert d'Messaging-Infrastruktur hannert engem Binding-Modell,\r

      sou datt Äre Code Funktiounen schwätzt, net Kafka-Clients.\r"
  para-swap-the-binder-kafka:
    en: "Swap the binder (Kafka, Rabbit, Kafka Streams) without touching the function.\r"
    fr: "Changez le binder (Kafka, Rabbit, Kafka Streams) sans toucher à la fonction.\r"
    lb: "Wiesselt de Binder (Kafka, Rabbit, Kafka Streams) ouni d'Funktioun ze beréieren.\r"
  profiles:
    en: "## Profiles\r"
    fr: "## Profils\r"
    lb: "## Profiler\r"
  para-profiles-load-different-configuration:
    en: "Profiles load different configuration per environment. Files are named\r

      `application-{profile}.yml`, and `spring.profiles.active` selects them.\r"
    fr: "Les profils chargent une configuration différente par environnement. Les\r

      fichiers se nomment `application-{profile}.yml`, et `spring.profiles.active` les\r

      sélectionne.\r"
    lb: "Profiler luede pro Ëmfeld eng aner Configuratioun. D'Dateien heeschen\r

      `application-{profile}.yml`, an `spring.profiles.active` wielt se aus.\r"
  loading-multiple-profiles:
    en: "### Loading multiple profiles\r"
    fr: "### Chargement de plusieurs profils\r"
    lb: "### Méi Profiler lueden\r"
  para-profiles-are-additive-and:
    en: "Profiles are additive and ordered — activate several at once:\r"
    fr: "Les profils sont additifs et ordonnés — activez-en plusieurs à la fois :\r"
    lb: "Profiler sinn additiv an uerdentlech — aktivéiert méi gläichzäiteg:\r"
  para-loading-rules:
    en: "Loading rules:\r"
    fr: "Règles de chargement :\r"
    lb: "Lued-Regelen:\r"
  list-a-later-profile-overrides-an-earlier-one:
    en: "- A **later** profile overrides an **earlier** one.\r

      - Every `application-{profile}.yml` overrides the base `application.yml`.\r

      - With no active profile, Spring uses the `default` profile (`application.yml`\r

      \  only).\r

      - Activate externally with the `SPRING_PROFILES_ACTIVE` environment variable or\r

      \  `--spring.profiles.active=dev,local`.\r"
    fr: "- Un profil **plus tardif** remplace un profil **plus précoce**.\r

      - Chaque `application-{profile}.yml` remplace le `application.yml` de base.\r

      - Sans profil actif, Spring utilise le profil `default` (`application.yml`\r

      \  seulement).\r

      - Activez-les en externe avec la variable d'environnement `SPRING_PROFILES_ACTIVE`\r

      \  ou `--spring.profiles.active=dev,local`.\r"
    lb: "- E **spéidere** Profil iwwerschreift e **frësche** Profil.\r

      - All `application-{profile}.yml` iwwerschreift d'Basis-`application.yml`.\r

      - Ouni aktive Profil benotzt Spring de `default`-Profil (`application.yml`\r

      \  nëmmen).\r

      - Aktivéiert se vu baussen iwwer d'Ëmfeldvariabel `SPRING_PROFILES_ACTIVE` oder\r

      \  `--spring.profiles.active=dev,local`.\r"
  para-a-profile-can-pull:
    en: "A profile can pull in others with `include`:\r"
    fr: "Un profil peut aussi en inclure d'autres avec `include` :\r"
    lb: "E Profil kann anerer mat `include` eraopzéien:\r"
  para-you-can-also-gate:
    en: "You can also gate beans with `@Profile`.\r"
    fr: "Vous pouvez aussi conditionner des beans avec `@Profile`.\r"
    lb: "Dir kënnt Beans och mat `@Profile` gaten.\r"
  spring-cloud-gateway:
    en: "## Spring Cloud Gateway\r"
    fr: "## Spring Cloud Gateway\r"
    lb: "## Spring Cloud Gateway\r"
  para-the-gateway-routes-requests:
    en: "The gateway routes requests to downstream services using predicates and\r

      filters.\r"
    fr: "La gateway route les requêtes vers les services en aval à l'aide de prédicats et\r

      de filtres.\r"
    lb: "D'Gateway route Ufroen op Downstream-Servicer mat Predicates a Filteren.\r"
  para-predicates-match-the-request:
    en: "Predicates match the request; filters transform it (rewrite path, add headers,\r

      circuit-break). Paired with a discovery client, `lb://` load-balances across\r

      instances.\r"
    fr: "Les prédicats font correspondre la requête ; les filtres la transforment\r

      (réécrire le chemin, ajouter des en-têtes, couper le circuit). Avec un client de\r

      découverte, `lb://` répartit la charge entre les instances.\r"
    lb: "Predicates passen d'Ufro un; Filteren transforméieren se (Pad ëmschreiwen,\r

      Header derbäisetzen, Circuit Breaker). Mat engem Discovery-Client verdeelt\r

      `lb://` d'Laascht iwwer d'Instanzen.\r"
  spring-batch:
    en: "## Spring Batch\r"
    fr: "## Spring Batch\r"
    lb: "## Spring Batch\r"
  para-spring-batch-handles-large:
    en: "Spring Batch handles large, scheduled data processing: read in chunks, process,\r

      write, with restart and retry built in. A job is made of chunk-oriented steps.\r"
    fr: "Spring Batch gère de grands traitements de données planifiés : lire par blocs,\r

      traiter, écrire, avec reprise et nouvelle tentative intégrées. Un job est\r

      constitué d'étapes orientées par blocs (chunk).\r"
    lb: "Spring Batch verschafft grouss, geplangt Dateveraarbechtung: a Bléck liesen,\r

      veraarbechten, schreiwen, mat Restart a Retry agebaut. E Job besteet aus\r

      chunkorientéierte Schrëtt.\r"
  list-job-the-whole-batch-process:
    en: "- **Job** — the whole batch process.\r

      - **Step** — one phase; here a chunk step that reads, transforms, and writes.\r

      - **Reader / Processor / Writer** — the chunk pipeline.\r

      - **chunk(100)** — process 100 items per transaction, so a failure rolls back\r

      \  one chunk, not the whole job.\r"
    fr: "- **Job** — tout le processus batch.\r

      - **Step** — une phase ; ici une étape par blocs qui lit, transforme et écrit.\r

      - **Reader / Processor / Writer** — le pipeline de blocs.\r

      - **chunk(100)** — traite 100 éléments par transaction, pour qu'un échec annule\r

      \  un bloc, pas tout le job.\r"
    lb: "- **Job** — de ganze Batch-Prozess.\r

      - **Step** — eng Phas; hei e Chunk-Schrëtt, dee liest, transforméiert a schreift.\r

      - **Reader / Processor / Writer** — de Chunk-Pipeline.\r

      - **chunk(100)** — veraarbecht 100 Elementer pro Transaktioun, sou datt e Feeler\r

      \  ee Chunk zeréckrullt, net de ganze Job.\r"
  para-spring-batch-records-job:
    en: "Spring Batch records job and step status in a metadata store, so jobs can be\r

      restarted from where they failed.\r"
    fr: "Spring Batch enregistre l'état du job et des étapes dans un stockage de\r

      métadonnées, pour que les jobs puissent reprendre là où ils ont échoué.\r"
    lb: "Spring Batch protokolléiert de Job- a Schrëtt-Status an engem\r

      Metadaten-Späicher, sou datt Jobs do kënne weiderfueren, wou se feelgeschloe sinn.\r"
  java-version-history:
    en: "## Java version history\r"
    fr: "## Historique des versions Java\r"
    lb: "## Java Versiounsgeschicht\r"
  para-a-condensed-timeline-of:
    en: "A condensed timeline of the major releases and their headline changes.\r"
    fr: "Une chronologie condensée des versions majeures et de leurs changements clés.\r"
    lb: "Eng kompakt Chronologie vun de grousse Versiounen an hire Kärännerungen.\r"
  para-version-release:
    en: "| Version | Release | Breaking changes / news |\r

      | ------- | ------- | ----------------------- |\r

      | 8 | Mar 2014 | Lambdas, Streams, `Optional`, `java.time`; PermGen removed (Metaspace) |\r

      | 9 | Sep 2017 | Module system (JPMS/Jigsaw), JShell, `List.of`/`Map.of` |\r

      | 10 | Mar 2018 | `var` local-variable type inference |\r

      | 11 | Sep 2018 | LTS; `HttpClient`, `var` in lambdas; Java EE & CORBA modules removed |\r

      | 12 | Mar 2019 | Switch expressions (preview), Shenandoah GC |\r

      | 13 | Sep 2019 | Text blocks (preview), ZGC |\r

      | 14 | Mar 2020 | Switch expressions standard; records & pattern matching (preview) |\r

      | 15 | Sep 2020 | Text blocks standard; sealed classes (preview) |\r

      | 16 | Mar 2021 | Records standard; pattern matching for `instanceof` standard |\r

      | 17 | Sep 2021 | LTS; sealed classes standard; strong encapsulation of JDK internals |\r

      | 18 | Mar 2022 | UTF-8 default charset; simple web server |\r

      | 19 | Sep 2022 | Virtual threads (preview); record patterns (preview) |\r

      | 20 | Mar 2023 | Record patterns standard; virtual threads (2nd preview) |\r

      | 21 | Sep 2023 | LTS; virtual threads standard, pattern matching for switch, sequenced collections |\r

      | 22 | Mar 2024 | Unnamed variables & patterns; statements before `super()` |\r

      | 23 | Sep 2024 | Module import declarations (preview); primitive patterns (preview) |\r

      | 24 | Mar 2025 | Compact object headers, class-file API, stream gatherers |\r

      | 25 | Sep 2025 | LTS; structured concurrency & scoped values stable |\r"
    fr: "| Version | Sortie | Changements majeurs / breaking changes |\r

      | ------- | ------ | -------------------------------------- |\r

      | 8 | Mars 2014 | Lambdas, Streams, `Optional`, `java.time` ; PermGen supprimé (Metaspace) |\r

      | 9 | Sept 2017 | Système de modules (JPMS/Jigsaw), JShell, `List.of`/`Map.of` |\r

      | 10 | Mars 2018 | Inférence de type `var` pour les variables locales |\r

      | 11 | Sept 2018 | LTS ; `HttpClient`, `var` dans les lambdas ; modules Java EE & CORBA supprimés |\r

      | 12 | Mars 2019 | Expressions switch (aperçu), Shenandoah GC |\r

      | 13 | Sept 2019 | Blocs de texte (aperçu), ZGC |\r

      | 14 | Mars 2020 | Expressions switch standard ; records & pattern matching (aperçu) |\r

      | 15 | Sept 2020 | Blocs de texte standard ; classes scellées (aperçu) |\r

      | 16 | Mars 2021 | Records standard ; pattern matching pour `instanceof` standard |\r

      | 17 | Sept 2021 | LTS ; classes scellées standard ; forte encapsulation des internes du JDK |\r

      | 18 | Mars 2022 | Jeu de caractères UTF-8 par défaut ; serveur web simple |\r

      | 19 | Sept 2022 | Threads virtuels (aperçu) ; record patterns (aperçu) |\r

      | 20 | Mars 2023 | Record patterns standard ; threads virtuels (2e aperçu) |\r

      | 21 | Sept 2023 | LTS ; threads virtuels standard, pattern matching pour switch, collections séquencées |\r

      | 22 | Mars 2024 | Variables & motifs sans nom ; instructions avant `super()` |\r

      | 23 | Sept 2024 | Déclarations d'import de module (aperçu) ; motifs primitifs (aperçu) |\r

      | 24 | Mars 2025 | En-têtes d'objets compacts, API class-file, stream gatherers |\r

      | 25 | Sept 2025 | LTS ; concurrence structurée & scoped values stables |\r"
    lb: "| Versioun | Release | Breaking Changes / Neiegkeeten |\r

      | -------- | ------- | ------------------------------ |\r

      | 8 | Mäerz 2014 | Lambdas, Streams, `Optional`, `java.time`; PermGen ewechgeholl (Metaspace) |\r

      | 9 | Sept 2017 | Modulsystem (JPMS/Jigsaw), JShell, `List.of`/`Map.of` |\r

      | 10 | Mäerz 2018 | `var` Typinferenz fir lokal Variabelen |\r

      | 11 | Sept 2018 | LTS; `HttpClient`, `var` a Lambdas; Java EE & CORBA Moduler ewechgeholl |\r

      | 12 | Mäerz 2019 | Switch Expressions (Virschau), Shenandoah GC |\r

      | 13 | Sept 2019 | Text Blocks (Virschau), ZGC |\r

      | 14 | Mäerz 2020 | Switch Expressions standard; Records & Pattern Matching (Virschau) |\r

      | 15 | Sept 2020 | Text Blocks standard; Sealed Classes (Virschau) |\r

      | 16 | Mäerz 2021 | Records standard; Pattern Matching fir `instanceof` standard |\r

      | 17 | Sept 2021 | LTS; Sealed Classes standard; staark Enkapsulatioun vun den JDK-Internen |\r

      | 18 | Mäerz 2022 | UTF-8 Standard Charset; einfachen Webserver |\r

      | 19 | Sept 2022 | Virtuell Threads (Virschau); Record Patterns (Virschau) |\r

      | 20 | Mäerz 2023 | Record Patterns standard; Virtuell Threads (2. Virschau) |\r

      | 21 | Sept 2023 | LTS; Virtuell Threads standard, Pattern Matching fir Switch, Sequenced Collections |\r

      | 22 | Mäerz 2024 | Onbenannt Variabelen & Mustern; Aussoen virun `super()` |\r

      | 23 | Sept 2024 | Modul-Import-Deklaratiounen (Virschau); primitiv Mustern (Virschau) |\r

      | 24 | Mäerz 2025 | Kompakt Objet-Header, Class-File API, Stream Gatherers |\r

      | 25 | Sept 2025 | LTS; Strukturéiert Concurrency & Scoped Values stabil |\r"
  wrapping-up:
    en: "## Wrapping up\r"
    fr: "## Pour conclure\r"
    lb: "## Zum Schluss\r"
  para-modern-java-leans-on:
    en: "Modern Java leans on records, pattern matching, sealed types, and virtual\r

      threads to cut boilerplate and scale. The Spring ecosystem layers Boot's\r

      auto-configuration, Security's filter chain, JPA's repositories, Cloud Stream's\r

      bindings, profiles, and a gateway on top. Together they give you a production\r

      backend that is concise, typed, and easy to reason about.\r"
    fr: "Le Java moderne s'appuie sur les records, le pattern matching, les types\r

      scellés et les threads virtuels pour réduire le boilerplate et passer à\r

      l'échelle. L'écosystème Spring empile l'auto-configuration de Boot, la chaîne de\r

      filtres de Security, les repositories de JPA, les bindings de Cloud Stream, les\r

      profils et une gateway. Ensemble, ils donnent un backend de production concis,\r

      typé et facile à raisonner.\r"
    lb: "Modernt Java verléisst sech op Records, Pattern Matching, Sealed Types a\r

      Virtuell Threads, fir Boilerplate ze reduzéieren an ze skaléieren. Den\r

      Spring-Ecosystem leet d'Auto-Configuratioun vu Boot, d'Filterkette vu Security,\r

      d'Repositories vu JPA, d'Bindings vu Cloud Stream, Profiler an eng Gateway\r

      drop. Zesummen ginn se Iech e Produktiouns-Backend, dee kompakt, typiséiert an\r

      einfach ze verstoen ass.\r"
