  list-tailwindcss-vite-the-vite-plugin-add-it-once-forget-it:
    en: "- `@tailwindcss/vite` — the Vite plugin (add it once, forget it).\r

      - `prettier-plugin-tailwindcss` — sorts utility classes for a consistent order.\r

      - `clsx` + `tailwind-merge` — compose and dedupe classes.\r

      - `class-variance-authority` — typed component variants.\r"
    fr: "- `@tailwindcss/vite` — le plugin Vite (ajoutez-le une fois, oubliez-le).\r

      - `prettier-plugin-tailwindcss` — trie les classes utilitaires pour un ordre\r

      \  cohérent.\r

      - `clsx` + `tailwind-merge` — composez et dédupliquez les classes.\r

      - `class-variance-authority` — des variantes de composants typées.\r"
    lb: "- `@tailwindcss/vite` — de Vite-Plugin (eemol addéieren, vergiessen).\r

      - `prettier-plugin-tailwindcss` — sortéiert Utility-Klassen fir eng konsequent\r

