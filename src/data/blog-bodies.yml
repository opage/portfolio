    lb: "## Zum Schluss\r"
  para-numpy-does-the-math:
    en: "NumPy does the math, pandas shapes the data, yfinance feeds it, and matplotlib\r

      shows it. Master these four and you can compute returns, indicators, and Monte\r

      Carlo simulations — the backbone of quantitative finance in Python.\r"
    fr: "NumPy fait le calcul, pandas façonne les données, yfinance les alimente et\r

      matplotlib les montre. Maîtrisez ces quatre-là et vous pourrez calculer des\r

      rendements, des indicateurs et des simulations de Monte-Carlo — l'épine dorsale\r

      de la finance quantitative en Python.\r"
    lb: "NumPy mécht d'Mathematik, pandas formt d'Daten, yfinance liwwert se a\r

      matplotlib weist se. Wann Dir déi véier beherrscht, kënnt Dir Rendementer,\r

      Indikatoren a Monte-Carlo-Simulatiounen berechnen — d'Réckgrat vun der\r

      quantitativer Finanz a Python.\r"
relational-databases-for-experts:
  para-relational-databases-power-most:
    en: "Relational databases power most applications for good reason: they give you\r

      strong guarantees and a clear model. This guide walks through the concepts every\r

      expert DBA lives by, with SQL examples and diagrams.\r"
    fr: "Les bases de données relationnelles font tourner la plupart des applications\r

      pour une bonne raison : elles offrent de solides garanties et un modèle clair.\r

      Ce guide parcourt les concepts sur lesquels tout DBA expert s'appuie, avec des\r

      exemples SQL et des diagrammes.\r"
    lb: "Relationell Datenbanken dreuwen déi meescht Applikatiounen aus engem gudde\r

      Grond: si ginn Iech staark Garantien an e klore Modell. Dëse Guide geet duerch\r

      d'Konzepter, op déi sech all Expert-DBA verléisst, mat SQL-Beispiller an\r

      Diagrammer.\r"
  acid:
    en: "## ACID\r"
    fr: "## ACID\r"
    lb: "## ACID\r"
  para-acid-describes-the-four:
    en: "ACID describes the four guarantees a transaction provides.\r"
    fr: "ACID décrit les quatre garanties qu'offre une transaction.\r"
    lb: "ACID beschreift déi véier Garantien, déi eng Transaktioun bitt.\r"
  list-atomicity-all-statements-succeed-or-none-do:
    en: "- **Atomicity** — all statements succeed or none do.\r

      - **Consistency** — the database moves from one valid state to another.\r

      - **Isolation** — concurrent transactions do not interfere.\r

      - **Durability** — committed data survives a crash.\r"
    fr: "- **Atomicité** — toutes les instructions réussissent ou aucune.\r

      - **Cohérence** — la base passe d'un état valide à un autre état valide.\r

      - **Isolation** — les transactions concurrentes n'interfèrent pas.\r

      - **Durabilité** — les données validées survivent à un crash.\r"
    lb: "- **Atomicitéit** — all Aussoen erfollegen oder keng.\r

      - **Konsistenz** — d'Datebank wiesselt vun engem gültege Zoustand an en aneren.\r

      - **Isolatioun** — parallel Transaktioune stéieren sech net.\r

      - **Durabilitéit** — committéiert Daten iwwerliewen e Crash.\r"
  primary-keys:
    en: "## Primary keys\r"
    fr: "## Clés primaires\r"
    lb: "## Primärschlësselen\r"
  para-a-primary-key-uniquely:
    en: "A primary key uniquely identifies every row. It is always `NOT NULL` and unique.\r

      Prefer a surrogate key (identity, UUID) over a natural key that can change.\r"
    fr: "Une clé primaire identifie chaque ligne de façon unique. Elle est toujours\r

      `NOT NULL` et unique. Préférez une clé de substitution (identité, UUID) à une\r

      clé naturelle qui peut changer.\r"
    lb: "E Primärschlëssel identifizéiert all Zeil eendeiteg. En ass ëmmer `NOT NULL` an\r

      eendeiteg. Léiwer e Surrogat-Schlëssel (Identity, UUID) wéi en natierleche\r

      Schlëssel, dee sech ännere kann.\r"
  para-composite-keys-identify-a:
    en: "Composite keys identify a row by several columns together — the classic\r

      join-table case.\r"
    fr: "Les clés composites identifient une ligne par plusieurs colonnes ensemble — le\r

      cas classique d'une table de jointure.\r"
    lb: "Kompositschlësselen identifizéieren eng Zeil iwwer méi Spalten zesummen — dee\r

      klassesche Fall vun enger Join-Tabelle.\r"
  foreign-keys:
    en: "## Foreign keys\r"
    fr: "## Clés étrangères\r"
    lb: "## Friemschlësselen\r"
  para-a-foreign-key-enforces:
    en: "A foreign key enforces referential integrity: every value must exist in the\r

      referenced table. `ON DELETE` / `ON UPDATE` tell the engine what to do when the\r

      parent changes.\r"
    fr: "Une clé étrangère garantit l'intégrité référentielle : chaque valeur doit\r

      exister dans la table référencée. `ON DELETE` / `ON UPDATE` indiquent au moteur\r

      quoi faire quand le parent change.\r"
    lb: "E Friemschlëssel garantéiert d'referenziell Integritéit: all Wäert muss an der\r

      referenzéierter Tabelle existéieren. `ON DELETE` / `ON UPDATE` soen der Engine,\r

      wat se maache soll, wann den Elter sech ännert.\r"
  para-cascade-deletes-the-child:
    en: "`CASCADE` deletes the child when the parent goes; `SET NULL` clears the column;\r

      `RESTRICT` blocks the change.\r"
    fr: "`CASCADE` supprime l'enfant quand le parent disparaît ; `SET NULL` efface la\r

      colonne ; `RESTRICT` bloque le changement.\r"
    lb: "`CASCADE` läscht d'Kand, wann den Elter verschwënnt; `SET NULL` läscht d'Spalt;\r

      `RESTRICT` blockéiert d'Ännerung.\r"
  sql-commands-ddl-dql-dml-dcl-tcl:
