    lb: "`rolling` gëtt eng einfach Fënster; `ewm` eng exponentiell. De Crossover vun\r

      enger kuerzer iwwer eng laang Moyenne ass e klassescht Signal.\r"
  visualization-with-matplotlib:
    en: "## Visualization with matplotlib\r"
