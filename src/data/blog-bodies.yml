    fr: "NumPy fournit des tableaux rapides et vectorisés — le socle de tout calcul\r

      financier.\r"
    lb: "NumPy gëtt Iech séier, vectoriséiert Arrays — d'Fundament fir all\r

      Finanzberechnung.\r"
  para-everything-is-element-wise-so:
