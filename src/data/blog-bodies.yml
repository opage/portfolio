order-saga-state-machine:
  the-problem-with-a-single-transaction:
    en: "## The problem with a single transaction\r"
    fr: "## Le problème d'une transaction unique\r"
    lb: "## De Problem mat enger eenzeger Transaktioun\r"
  para-a-checkout-rarely-completes:
    en: "A checkout rarely completes in one request. Money must be captured, stock must be\r

      set aside, and the warehouse must be told to ship. Trying to wrap all of that in\r

      one distributed transaction — a two-phase commit across services — looks tidy on\r

      paper but breaks down quickly in reality.\r"
    fr: "Un checkout se termine rarement en une seule requête. L'argent doit être\r

      encaissé, le stock doit être réservé et l'entrepôt doit être prévenu pour\r

      l'expédition. Tout envelopper dans une transaction distribuée — un commit en\r

      deux phases entre services — semble propre sur le papier, mais s'effondre vite\r

      dans la réalité.\r"
    lb: "E Checkout ass selten an enger Ufro fäerdeg. D'Geld muss agezunn, de Stock muss\r

      reservéiert an d'Lager muss iwwer d'Liwwerung informéiert ginn. Dat alles an eng\r

      eenzeg verdeelt Transaktioun ze wéckelen — en Zwee-Phase-Commit iwwer Servicer —\r

      gesäit op Pabeier propper aus, brécht awer an der Realitéit séier zesummen.\r"
  para-the-catch-is-that:
    en: "The catch is that no service can predict how long another will take. A payment\r

      provider might wait on a fraud review, and a stock check might be slow under load.\r

      Keeping locks open across several systems for that long is impractical and can\r

      drag the whole platform down.\r"
    fr: "Le hic, c'est qu'aucun service ne peut prédire combien de temps un autre mettra.\r

      Un prestataire de paiement peut attendre une vérification anti-fraude, et un\r

      contrôle de stock peut être lent sous la charge. Garder des verrous ouverts sur\r

      plusieurs systèmes pendant aussi longtemps est irréaliste et peut alourdir toute\r

      la plateforme.\r"
    lb: "D'Problem ass, datt kee Service viraussoe kann, wéi laang en anere braucht. E\r

      Bezuel-Provider ka waarden, bis eng Fraud-Prüfung duerch ass, an eng\r

      Stock-Kontroll ka bei Laascht lues sinn. Spären iwwer verschidde Systemer sou\r

      laang opzehalen ass onpraktesch a kann déi ganz Plattform bremsen.\r"
  para-a-saga-sidesteps-this:
    en: "A **saga** sidesteps this by cutting the flow into local steps that each finish\r

      quickly and can be undone on their own.\r"
    fr: "Un **saga** contourne cela en découpant le flux en étapes locales qui se\r

      terminent rapidement et peuvent être annulées séparément.\r"
    lb: "E **Saga** ëmgeet dat, andeems de Flux a lokal Schrëtt opgedeelt gëtt, déi\r

      séier fäerdeg sinn an eenzel réckgängeg gemaach kënne ginn.\r"
  what-a-saga-actually-is:
    en: "## What a saga actually is\r"
    fr: "## Ce qu'est réellement un saga\r"
    lb: "## Wat e Saga wierklech ass\r"
  para-a-saga-is-a:
    en: "A saga is a chain of local actions where every step has a matching **compensating\r

      action** that reverses it when a later step fails. Instead of one atomic\r

      operation, the work is split into small, independently recoverable pieces.\r"
    fr: "Un saga est une chaîne d'actions locales où chaque étape possède une **action\r

      compensatoire** qui l'inverse lorsqu'une étape ultérieure échoue. Au lieu d'une\r

      opération atomique, le travail est découpé en petits morceaux récupérables\r

      indépendamment.\r"
    lb: "E Saga ass eng Kette vu lokalen Aktiounen, wou all Schrëtt eng passend\r

      **kompenséierend Aktioun** huet, déi e réckgängeg mécht, wann e spéidere Schrëtt\r

      feelgeet. Amplaz vun enger atomarer Operatioun gëtt d'Aarbecht a kleng,\r

      onofhängeg erholbar Stécker opgedeelt.\r"
  para-take-an-order-as:
    en: "Take an order as an example:\r"
    fr: "Prenons une commande comme exemple :\r"
    lb: "Huelt eng Bestellung als Beispill:\r"
  para-if-the-inventory-step:
    en: "If the inventory step reports that an item is sold out after payment has already\r

      gone through, the saga fires a reimbursement to give the money back. Each piece\r

      is decoupled, and nothing stays locked for the entire journey.\r"
    fr: "Si l'étape de stock signale qu'un article est épuisé après que le paiement est\r

      déjà passé, le saga déclenche un remboursement pour rendre l'argent. Chaque\r

      pièce est découplée et rien ne reste verrouillé pendant tout le parcours.\r"
    lb: "Wann de Stock-Schrëtt mellt, datt en Artikel ausverkaaft ass nodeems d'Bezuelung\r

      scho duerch ass, léist de Saga eng Réckzuelung aus, fir d'Geld zeréckzeginn. All\r

      Deel ass entkoppelt, an näischt bleift de ganze Wee gespaart.\r"
  masstransit-sagas-are-state-machines:
    en: "## MassTransit sagas are state machines\r"
    fr: "## Les sagas MassTransit sont des machines à états\r"
    lb: "## MassTransit-Sagas si State-Machinen\r"
  para-masstransit-https-masstransit-io-implements-sagas-through:
    en: "[MassTransit](https://masstransit.io) implements sagas through a state machine,\r

      an approach inherited from Automatonymous. Before writing code it helps to know\r

      the four parts that make up the model:\r"
    fr: "[MassTransit](https://masstransit.io) implémente les sagas à travers une machine\r

      à états, une approche héritée d'Automatonymous. Avant d'écrire du code, il est\r

      utile de connaître les quatre éléments du modèle :\r"
    lb: "[MassTransit](https://masstransit.io) setzt Sagas iwwer eng State-Machine ëm,\r

      eng Approche, déi vun Automatonymous ierft. Ier ee Code schreift, hëlleft et,\r

      déi véier Deeler vum Modell ze kennen:\r"
  list-states-the-positions-a-workflow-can-be-in:
    en: "1. **States** — the positions a workflow can be in\r

      2. **Events** — messages that push the workflow from one state to another\r

      3. **Behaviors** — the work performed when an event lands in a given state\r

      4. **Instance** — the persisted record holding data for a single conversation\r"
    fr: "1. **États** — les positions que peut occuper un workflow\r

      2. **Événements** — les messages qui font passer le workflow d'un état à un autre\r

      3. **Comportements** — le travail effectué lorsqu'un événement arrive dans un état donné\r

      4. **Instance** — l'enregistrement persisté contenant les données d'une seule conversation\r"
    lb: "1. **Staaten** — d'Positiounen, an deenen e Workflow ka sinn\r

      2. **Eventer** — Messagen, déi de Workflow vun engem Staat an en anere réckelen\r

      3. **Behavioren** — d'Aarbecht, déi ausgefouert gëtt, wann en Event an engem bestëmmte Staat ukënnt\r

      4. **Instanz** — den persistéierten Datensaz mat den Daten vun enger eenzeger Konversatioun\r"
  para-every-state-machine-ships:
    en: "Every state machine ships with an `Initial` and a `Final` state for free. A new\r

      instance starts in `Initial`, and reaching `Final` means the saga has finished.\r"
    fr: "Chaque machine à états inclut gratuitement un état `Initial` et un état `Final`.\r

      Une nouvelle instance démarre dans `Initial`, et atteindre `Final` signifie que\r

      le saga est terminé.\r"
    lb: "All State-Machine huet gratis en `Initial`- an e `Final`-Staat. Eng nei Instanz\r

      fänkt am `Initial` un, a `Final` z'erreechen heescht, datt de Saga fäerdeg ass.\r"
  para-here-is-the-state:
    en: "Here is the state machine we are going to build:\r"
    fr: "Voici la machine à états que nous allons construire :\r"
    lb: "Hei ass d'State-Machine, déi mir baue wäerten:\r"
  the-saga-instance:
    en: "## The saga instance\r"
    fr: "## L'instance du saga\r"
    lb: "## D'Saga-Instanz\r"
  para-the-instance-is-the:
    en: "The instance is the entity that MassTransit persists between messages. It keeps\r

      the correlation key, the current state, and any business data the steps need.\r"
    fr: "L'instance est l'entité que MassTransit persiste entre les messages. Elle\r

      conserve la clé de corrélation, l'état courant et les données métier dont les\r

      étapes ont besoin.\r"
    lb: "D'Instanz ass d'Entitéit, déi MassTransit tëscht de Messagen persistéiert. Se\r

      hält de Korrelatiounsschlëssel, den aktuellen Staat an d'Business-Daten, déi\r

      d'Schrëtt brauchen.\r"
  para-correlationid-is-the-identifier:
    en: "`CorrelationId` is the identifier that ties every incoming message back to the\r

      right instance, while `CurrentState` records where the workflow currently stands.\r

      The remaining properties carry the data the process needs along the way.\r"
    fr: "`CorrelationId` est l'identifiant qui relie chaque message entrant à la bonne\r

      instance, tandis que `CurrentState` enregistre où en est le workflow. Les\r

      propriétés restantes transportent les données nécessaires au processus.\r"
    lb: "`CorrelationId` ass den Identifikateur, deen all erakommende Message mat der\r

      richteger Instanz verbënnt, iwwerdeems `CurrentState` festhält, wou de Workflow\r

      grad steet. Déi reschtlech Eegenschaften droen d'Daten, déi de Prozess ënnerwee\r

      brauch.\r"
  the-events:
    en: "## The events\r"
    fr: "## Les événements\r"
    lb: "## D'Eventer\r"
  para-events-are-the-messages:
    en: "Events are the messages that drive transitions. Each one must be correlated to a\r

      specific instance through a shared identifier.\r"
    fr: "Les événements sont les messages qui déclenchent les transitions. Chacun doit\r

      être corrélé à une instance précise via un identifiant partagé.\r"
    lb: "Eventer sinn d'Messagen, déi Iwwergäng ausléisen. All eenzel muss iwwer en\r

      gemeinsamen Identifikateur mat enger bestëmmter Instanz korreléiert sinn.\r"
  para-these-records-travel-over:
    en: "These records travel over the bus; the saga reacts to them and may publish new\r

      commands in response.\r"
    fr: "Ces records circulent sur le bus ; le saga y réagit et peut publier de nouvelles\r

      commandes en réponse.\r"
    lb: "Dës Records lafen iwwer de Bus; de Saga reagéiert dorop a kann als Äntwert nei\r

      Commande publizéieren.\r"
  building-the-state-machine:
    en: "## Building the state machine\r"
    fr: "## Construire la machine à états\r"
    lb: "## D'State-Machine bauen\r"
  para-the-state-machine-ties:
    en: "The state machine ties states, events, and behaviors together and declares which\r

      transitions are legal.\r"
    fr: "La machine à états relie les états, les événements et les comportements, et\r

      déclare quelles transitions sont autorisées.\r"
    lb: "D'State-Machine verbënnt Staaten, Eventer a Behavioren an deklaréiert, wéi eng\r

      Iwwergäng erlaabt sinn.\r"
  para-notice-the-compensation-logic:
    en: "Notice the compensation logic: when the stock step fails after payment, the saga\r

      publishes `ReimbursePayment` to unwind the charge. The happy path and the failure\r

      path are declared side by side, which makes the workflow easy to read.\r"
    fr: "Remarquez la logique de compensation : lorsque l'étape de stock échoue après le\r

      paiement, le saga publie `ReimbursePayment` pour annuler le débit. Le chemin\r

      nominal et le chemin d'échec sont déclarés côte à côte, ce qui rend le workflow\r

      facile à lire.\r"
    lb: "Opgepasst op d'Kompensatiounslogik: wann de Stock-Schrëtt nom Bezuelen feelgeet,\r

      publizéiert de Saga `ReimbursePayment`, fir de Betrag zeréckzebezuelen. De\r

      gléckleche Wee an de Feelerwee ginn niewentenee deklaréiert, wat de Workflow\r

      einfach liesbar mécht.\r"
  the-consumers:
    en: "## The consumers\r"
    fr: "## Les consumers\r"
    lb: "## D'Consumer\r"
  para-the-saga-is-the:
    en: "The saga is the coordinator, not the doer. The actual work lives in message\r

      consumers that handle commands and report back through events.\r"
    fr: "Le saga est le coordinateur, pas l'exécutant. Le vrai travail se trouve dans les\r

      consumers qui traitent les commandes et rendent compte via des événements.\r"
    lb: "De Saga ass de Koordinator, net den Ausféierer. Déi richteg Aarbecht läit an de\r

      Message-Consumer, déi Commande veraarbechten an iwwer Eventer zeréckmellen.\r"
  para-splitting-responsibilities-this-way:
    en: "Splitting responsibilities this way keeps each service focused on its own job,\r

      while the saga keeps the whole process moving in the right direction.\r"
    fr: "Séparer les responsabilités de cette façon permet à chaque service de se\r

      concentrer sur son propre rôle, pendant que le saga fait avancer tout le\r

      processus dans la bonne direction.\r"
    lb: "D'Verantwortungen esou ze trennen erlaabt all Service, sech op seng eege Roll ze\r

      konzentréieren, wärend de Saga de ganze Prozess an déi richteg Richtung beweegt.\r"
  wiring-it-up-with-azure-service-bus:
    en: "## Wiring it up with Azure Service Bus\r"
    fr: "## Configuration avec Azure Service Bus\r"
    lb: "## Mat Azure Service Bus opbauen\r"
  para-persisting-saga-state-requires:
    en: "Persisting saga state requires a repository. We will use Entity Framework Core\r

      against SQL Server, with Azure Service Bus as the transport.\r"
    fr: "Persister l'état du saga nécessite un dépôt. Nous utiliserons Entity Framework\r

      Core sur SQL Server, avec Azure Service Bus comme transport.\r"
    lb: "De Saga-Staat ze persistéieren brauch en Repository. Mir benotzen Entity\r

      Framework Core op SQL Server, mat Azure Service Bus als Transport.\r"
  para-first-the-required-packages:
    en: "First, the required packages:\r"
    fr: "D'abord, les paquets requis :\r"
    lb: "Als éischt déi néideg Packagen:\r"
  para-define-a-dbcontext-and:
    en: "Define a `DbContext` and a class map for the saga instance:\r"
    fr: "Définissez un `DbContext` et une carte de classe pour l'instance du saga :\r"
    lb: "Definéiert en `DbContext` an e Class-Map fir d'Saga-Instanz:\r"
  para-finally-register-everything-in:
    en: "Finally, register everything in the application:\r"
    fr: "Enfin, enregistrez le tout dans l'application :\r"
    lb: "Zum Schluss alles an der Applikatioun registréieren:\r"
  why-reach-for-sagas:
    en: "## Why reach for sagas\r"
    fr: "## Pourquoi choisir les sagas\r"
    lb: "## Firwat Sagas huelen\r"
  list-resilience-every-step-can-be-retried-on-its-own-and-failures-trigger:
    en: "- **Resilience** — every step can be retried on its own, and failures trigger\r

      \  compensation instead of leaving the system half-done.\r

      - **Visibility** — the current state tells you exactly where each order stands,\r

      \  which simplifies debugging and monitoring.\r

      - **Loose coupling** — services talk through messages and can evolve separately\r

      \  without breaking the overall flow.\r

      - **Maintainability** — a change to one step does not ripple through the others.\r"
    fr: "- **Résilience** — chaque étape peut être réessayée séparément, et les échecs\r

      \  déclenchent une compensation au lieu de laisser le système à moitié fait.\r

      - **Visibilité** — l'état courant indique exactement où en est chaque commande,\r

      \  ce qui simplifie le débogage et la supervision.\r

      - **Couplage lâche** — les services communiquent par messages et peuvent évoluer\r

      \  séparément sans casser le flux global.\r

      - **Maintenabilité** — une modification sur une étape ne se répercute pas sur\r

      \  les autres.\r"
    lb: "- **Resilienz** — all Schrëtt kann eenzel nei probéiert ginn, a Feeler léisen\r

      \  Kompensatioun aus, amplaz de System hallef fäerdeg hannerloossen.\r

      - **Visibilitéit** — den aktuellen Staat seet genee, wou all Bestellung steet,\r

      \  wat Debuggen an Iwwerwaachung vereinfacht.\r

      - **Loos Kopplung** — Servicer kommunizéieren iwwer Messagen a kënne sech\r

      \  separat weiderentwéckelen, ouni de ganze Flux ze briechen.\r

      - **Maintainabilitéit** — eng Ännerung an engem Schrëtt schléit net op déi aner\r

      \  duerch.\r"
  para-the-state-machine-also:
    en: "The state machine also forces the business process to be explicit. Every state\r

      and transition is spelled out, turning a murky distributed flow into something a\r

      new team member can follow.\r"
    fr: "La machine à états force aussi le processus métier à être explicite. Chaque état\r

      et transition est énoncé clairement, transformant un flux distribué opaque en\r

      quelque chose qu'un nouveau membre de l'équipe peut suivre.\r"
    lb: "D'State-Machine zwéngt de Business-Prozess och, explizit ze sinn. All Staat an\r

      Iwwergank ass kloer festgehalen, wat aus engem opaken verdeelte Flux eppes mécht,\r

      dat en neie Teammember novollzéie kann.\r"
  wrapping-up:
    en: "## Wrapping up\r"
    fr: "## Conclusion\r"
    lb: "## Resumé\r"
  para-modeling-a-checkout-as:
    en: "Modeling a checkout as a MassTransit saga gives you coordinated, recoverable\r

      workflows without the pain of distributed transactions. Define the states and\r

      events, persist the instance, and let Azure Service Bus carry the messages. The\r

      result is a process that is clear, observable, and forgiving when things go\r

      wrong.\r"
    fr: "Modéliser un checkout comme un saga MassTransit donne des workflows coordonnés\r

      et récupérables sans la douleur des transactions distribuées. Définissez les\r

      états et les événements, persistez l'instance et laissez Azure Service Bus\r

      transporter les messages. Le résultat est un processus clair, observable et\r

      indulgent quand les choses tournent mal.\r"
    lb: "E Checkout als MassTransit-Saga ze modelléieren gëtt koordinéiert, erholbar\r

      Workflows ouni de Péng vun de verdeelten Transaktiounen. Definéiert d'Staaten an\r

      d'Eventer, persistéiert d'Instanz a loosst Azure Service Bus d'Messagen droen.\r

      D'Resultat ass e Prozess, dee kloer, observéierbar an nohalteg ass, wann eppes\r

      schif geet.\r"
python-for-finance:
  para-python-is-the-default:
    en: "Python is the default language of modern finance because its ecosystem covers\r

      everything from data cleaning to Monte Carlo simulation. This guide walks\r

      through the core libraries with real examples.\r"
    fr: "Python est le langage de référence de la finance moderne, car son écosystème\r

      couvre tout, du nettoyage de données à la simulation de Monte-Carlo. Ce guide\r

      parcourt les bibliothèques clés avec des exemples concrets.\r"
    lb: "Python ass déi dominant Sprooch vun der moderner Finanz, well säin Ecosystem\r

      alles ofdeckt, vum Datenopraumen bis zur Monte-Carlo-Simulatioun. Dëse Guide\r

      geet duerch d'Kärbibliothéiken mat reale Beispiller.\r"
  numpy-vectorized-financial-math:
    en: "## NumPy: vectorized financial math\r"
    fr: "## NumPy : le calcul financier vectorisé\r"
    lb: "## NumPy: vectoriséiert Finanz-Mathematik\r"
  para-numpy-gives-you-fast:
