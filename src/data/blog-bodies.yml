    fr: "Une belle UI est surtout de la cohérence, pas de la décoration.\r"
    lb: "Eng schéin UI ass virun allem Konsequenz, net Dekoratioun.\r"
  list-typography-one-font-scale-comfortable-line-height-constrained-measure:
    en: "- **Typography** — one font scale, comfortable line height, constrained measure.\r

      - **Spacing** — stick to the 4px scale; align to a grid.\r

      - **Color** — a small palette with one accent; check contrast for text.\r

      - **Motion** — short, subtle transitions (`transition`, `duration-150`).\r

      - **Dark mode** — design both, driven by the `dark` variant.\r"
    fr: "- **Typographie** — une seule échelle de polices, une hauteur de ligne\r

      \  confortable, une mesure contrainte.\r

      - **Espacement** — restez sur l'échelle de 4px ; alignez sur une grille.\r

      - **Couleur** — une petite palette avec un accent unique ; vérifiez le contraste.\r

      - **Mouvement** — des transitions courtes et subtiles (`transition`,\r

      \  `duration-150`).\r

      - **Mode sombre** — concevez les deux, piloté par la variante `dark`.\r"
    lb: "- **Typographie** — eng Fontskala, eng gemittlech Zeilenhéicht, e begrenzten\r

      \  Mooss.\r

      - **Ofstänn** — bleift op der 4px-Skala; alignéiert op e Gitter.\r

      - **Faarf** — eng kleng Palette mat engem Akzent; kontrolléiert de Kontrast.\r

      - **Beweegung** — kuerz, subtil Iwwergäng (`transition`, `duration-150`).\r

      - **Dark Mode** — designéiert béid, gedriwwen duerch d'`dark`-Variante.\r"
